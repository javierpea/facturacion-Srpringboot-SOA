spring.application.name=sistema-facturacion
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_facturacion
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#orm
# Configuración del SRI
sri.enabled=false
spring.jpa.hibernate.ddl-auto=update

# 3. Mostrar el SQL en consola
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 3. Limitación del pool de conexiones para reducir consumo base de RAM
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
