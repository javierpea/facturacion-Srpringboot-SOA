<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento de Sucursales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .animate-slide-down {
            animation: slideDown 0.25s ease-out forwards;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col">
<div th:replace="~{fragments/ui :: sidebar}"></div>
<div class="ml-64 flex flex-col min-h-screen">
<div th:replace="~{fragments/ui :: confirmacion}"></div>

<header class="w-full bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shadow-sm sticky top-0 z-40">
    <div class="flex items-center gap-3">
        <a th:href="@{/dashboard}" class="flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-blue-700 transition-colors border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-300 hover:bg-blue-50">
            <i class="ti ti-arrow-left" style="font-size:14px"></i> Panel
        </a>
        <div class="h-5 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2.5">
            <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-600 text-white shadow-md shadow-blue-200">
                <i class="ti ti-building" style="font-size:15px"></i>
            </span>
            <span class="font-black text-slate-900 text-base">Gestión de Sucursales</span>
        </div>
    </div>
</header>

<main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">

    <div th:if="${success}" class="mb-4 p-4 bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-2xl font-bold" th:text="${success}"></div>
    <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-200 text-red-800 rounded-2xl font-bold" th:text="${error}"></div>

    <!-- Top Card con Botón Nueva Sucursal -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-black tracking-tight text-slate-950">Sucursales Autorizadas</h1>
            <p class="text-sm text-slate-500 mt-1">Administra los establecimientos físicos emisores de facturación autorizados por el SRI.</p>
        </div>
        <button type="button" onclick="abrirModalSucursal()" class="inline-flex items-center gap-2 bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700 shadow-md shadow-blue-200 transition-all">
            <i class="ti ti-plus" style="font-size:15px"></i> Nueva Sucursal
        </button>
    </div>

    <!-- Buscador de Sucursales -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center">
        <div class="w-full md:w-1/3 relative">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Buscar por</label>
            <input type="hidden" id="searchParam" value="codigo" />
            <button type="button" id="searchParamTrigger" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold text-left flex justify-between items-center focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                <span id="searchParamLabel">Código</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-slate-500 transition-transform duration-200" id="searchParamArrow">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div id="searchParamMenu" class="absolute left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl hidden flex-col overflow-hidden z-50 animate-slide-down">
                <div data-value="codigo" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                    Código
                </div>
                <div data-value="nombre" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                    Nombre
                </div>
                <div data-value="ciudad" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                    Ciudad
                </div>
                <div data-value="estado" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                    Estado
                </div>
            </div>
        </div>
        <div class="w-full md:w-2/3">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Criterio de Búsqueda</label>
            <input type="text" id="searchInput" placeholder="Ingrese código (solo números)..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-bold" />
        </div>
    </div>

    <!-- Tabla de Sucursales -->
    <div class="bg-white rounded-3xl border border-slate-200 shadow-md overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-900 text-white text-xs font-bold uppercase tracking-wider">
                    <th class="px-6 py-4">Código</th>
                    <th class="px-6 py-4">Nombre</th>
                    <th class="px-6 py-4">Ciudad</th>
                    <th class="px-6 py-4 text-center">Estado</th>
                    <th class="px-6 py-4 text-center">Acciones</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                <tr th:each="s : ${sucursales}" class="hover:bg-slate-50 transition-colors" style="display: none;">
                    <td class="px-6 py-4 font-bold text-slate-950" th:text="${s.codigoEstablecimiento}"></td>
                    <td class="px-6 py-4 font-bold text-blue-600">
                        <span th:text="${s.nombre}"></span>
                        <div class="text-[10px] text-slate-400 font-bold uppercase mt-0.5" th:text="${s.direccion}"></div>
                    </td>
                    <td class="px-6 py-4 text-slate-500" th:text="${s.ciudad}"></td>
                    <td class="px-6 py-4 text-center">
                        <span th:if="${s.activo}" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold">Activo</span>
                        <span th:unless="${s.activo}" class="px-2.5 py-1 bg-slate-200 text-slate-600 rounded-full text-xs font-bold">Inactivo</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button type="button"
                                    th:data-id="${s.id}"
                                    th:data-codigo="${s.codigoEstablecimiento}"
                                    th:data-nombre="${s.nombre}"
                                    th:data-ciudad="${s.ciudad}"
                                    th:data-direccion="${s.direccion}"
                                    onclick="cargarDatosEdicion(this)"
                                    title="Editar"
                                    class="text-blue-600 hover:text-blue-800 p-2 rounded-xl hover:bg-blue-50 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                                </svg>
                            </button>
                            <form th:action="@{'/sucursales/toggle/' + ${s.id}}" method="POST" style="display:inline;" onsubmit="confirmarToggle(event, this, '¿Desea cambiar el estado de esta sucursal?')">
                                <button th:if="${s.activo}" type="submit" title="Desactivar" class="text-red-500 hover:text-red-700 p-2 rounded-xl hover:bg-red-50 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636" />
                                    </svg>
                                </button>
                                <button th:unless="${s.activo}" type="submit" title="Activar" class="text-emerald-500 hover:text-emerald-700 p-2 rounded-xl hover:bg-emerald-50 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                    </svg>
                                </button>
                            </form>
                            <a th:href="@{'/inventario?sucursalId=' + ${s.id}}"
                               title="Ver Inventario"
                               class="flex items-center gap-1.5 bg-slate-100 text-slate-700 hover:bg-blue-100 hover:text-blue-700 px-3 py-2 rounded-xl text-xs font-black transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
                                </svg>
                                <span>Inventario</span>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal de Sucursal -->
<div id="modalSucursal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-slide-down">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h3 id="formTitle" class="font-black text-slate-900 text-xl">Registrar Sucursal</h3>
            <button type="button" onclick="cerrarModalSucursal()" class="text-slate-400 hover:text-red-500 text-2xl leading-none">&times;</button>
        </div>
        <form id="sucursalForm" th:action="@{/sucursales/guardar}" th:object="${sucursal}" method="POST" class="p-6 space-y-4">
            <input type="hidden" id="sucursalId" th:field="*{id}" />

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Código Establecimiento (Ej: 001)</label>
                <input type="text" th:field="*{codigoEstablecimiento}" id="codigoEstablecimiento" required maxlength="3" minlength="3"
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-bold"
                       placeholder="001" pattern="[0-9]{3}" title="Debe contener exactamente 3 números"/>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nombre de la Sucursal</label>
                <input type="text" th:field="*{nombre}" id="nombre" required
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm"
                       placeholder="Sucursal Matriz" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras y espacios"/>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Ciudad</label>
                <input type="text" th:field="*{ciudad}" id="ciudad" required
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm"
                       placeholder="Quito" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras y espacios"/>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Dirección</label>
                <input type="text" th:field="*{direccion}" id="direccion"
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm"
                       placeholder="Av. Amazonas y Colón"/>
            </div>

            <div class="flex gap-2 pt-4">
                <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 text-white rounded-xl py-3 font-black text-sm hover:bg-blue-700 shadow-md transition-colors">Guardar Sucursal</button>
                <button type="button" onclick="cerrarModalSucursal()" class="px-6 bg-slate-200 text-slate-700 rounded-xl py-3 font-black text-sm hover:bg-slate-300 transition-colors">Cancelar</button>
            </div>
        </form>
    </div>
</div>
</div>
<script>
    function abrirModalSucursal() {
        resetForm();
        const modal = document.getElementById('modalSucursal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function cerrarModalSucursal() {
        const modal = document.getElementById('modalSucursal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function editSucursal(id, codigo, nombre, ciudad, direccion) {
        document.getElementById('sucursalId').value = id;
        document.getElementById('codigoEstablecimiento').value = codigo;
        document.getElementById('codigoEstablecimiento').readOnly = true;
        document.getElementById('codigoEstablecimiento').classList.add('bg-slate-200', 'cursor-not-allowed', 'text-slate-500');
        document.getElementById('nombre').value = nombre;
        document.getElementById('ciudad').value = ciudad;
        document.getElementById('direccion').value = (direccion === 'null' || !direccion) ? '' : direccion;

        document.getElementById('formTitle').innerText = 'Editar Sucursal';
        document.getElementById('submitBtn').innerText = 'Actualizar Sucursal';

        const modal = document.getElementById('modalSucursal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function resetForm() {
        document.getElementById('sucursalId').value = '';
        document.getElementById('sucursalForm').reset();
        document.getElementById('codigoEstablecimiento').readOnly = false;
        document.getElementById('codigoEstablecimiento').classList.remove('bg-slate-200', 'cursor-not-allowed', 'text-slate-500');
        document.getElementById('formTitle').innerText = 'Registrar Sucursal';
        document.getElementById('submitBtn').innerText = 'Guardar Sucursal';
    }

    function cargarDatosEdicion(btnElement) {
        const id = btnElement.getAttribute('data-id');
        const codigo = btnElement.getAttribute('data-codigo');
        const nombre = btnElement.getAttribute('data-nombre');
        const ciudad = btnElement.getAttribute('data-ciudad');
        const direccion = btnElement.getAttribute('data-direccion');

        editSucursal(id, codigo, nombre, ciudad, direccion);
    }

    // Filtros de entrada en tiempo real

    // Código Establecimiento: solo números (máx 3 caracteres)
    document.getElementById('codigoEstablecimiento').addEventListener('input', function() {
        let cleanVal = this.value.replace(/[^0-9]/g, '');
        if (cleanVal.length > 3) {
            cleanVal = cleanVal.substring(0, 3);
        }
        this.value = cleanVal;
    });

    // Nombre: solo letras y espacios
    document.getElementById('nombre').addEventListener('input', function() {
        let cleanVal = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        this.value = cleanVal;
    });

    // Ciudad: solo letras y espacios
    document.getElementById('ciudad').addEventListener('input', function() {
        let cleanVal = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        this.value = cleanVal;
    });
    // Función para confirmación de acciones directas
    function confirmarToggle(event, form, mensaje) {
        event.preventDefault();
        preguntarConfirmacion(mensaje, () => {
            form.submit();
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        initDynamicSearch();
    });

    function initDynamicSearch() {
        const searchParam = document.getElementById('searchParam');
        const searchInput = document.getElementById('searchInput');

        // Setup custom search selector menu behavior
        const trigger = document.getElementById('searchParamTrigger');
        const menu = document.getElementById('searchParamMenu');
        const label = document.getElementById('searchParamLabel');
        const arrow = document.getElementById('searchParamArrow');
        const options = document.querySelectorAll('.search-option');
        const optionLabels = {
            'codigo': 'Código',
            'nombre': 'Nombre',
            'ciudad': 'Ciudad',
            'estado': 'Estado'
        };

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const isHidden = menu.classList.contains('hidden');
            if (isHidden) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
                arrow.classList.add('rotate-180');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                arrow.classList.remove('rotate-180');
            }
        });

        document.addEventListener('click', function() {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
            arrow.classList.remove('rotate-180');
        });

        options.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const val = this.getAttribute('data-value');
                selectSearchParam(val);
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                arrow.classList.remove('rotate-180');
            });
        });

        function selectSearchParam(value) {
            searchParam.value = value;
            label.textContent = optionLabels[value] || value;

            options.forEach(opt => {
                if (opt.getAttribute('data-value') === value) {
                    opt.classList.add('bg-blue-50', 'text-blue-600');
                } else {
                    opt.classList.remove('bg-blue-50', 'text-blue-600');
                }
            });

            searchInput.value = '';
            updateSearchInputValidation();
            filterSucursalesTable();
        }

        searchInput.addEventListener('input', () => {
            validateSearchInput();
            filterSucursalesTable();
        });

        function updateSearchInputValidation() {
            const param = searchParam.value;
            if (param === 'codigo') {
                searchInput.placeholder = 'Ingrese código establecimiento (solo números)...';
            } else if (param === 'nombre') {
                searchInput.placeholder = 'Ingrese nombre sucursal (solo letras)...';
            } else if (param === 'ciudad') {
                searchInput.placeholder = 'Ingrese ciudad (solo letras)...';
            } else if (param === 'estado') {
                searchInput.placeholder = 'Ingrese estado (activo/inactivo - solo letras)...';
            }
        }

        function validateSearchInput() {
            const param = searchParam.value;
            let val = searchInput.value;
            if (param === 'codigo') {
                val = val.replace(/[^0-9]/g, '');
            } else if (param === 'nombre' || param === 'ciudad' || param === 'estado') {
                val = val.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
            }
            searchInput.value = val;
        }

        function filterSucursalesTable() {
            const param = searchParam.value;
            const query = searchInput.value.trim().toLowerCase();

            const tableBody = document.querySelector('table tbody');
            const rows = Array.from(tableBody.querySelectorAll('tr:not(.placeholder-row)'));
            let placeholderRow = document.getElementById('placeholderRow');

            if (!placeholderRow) {
                placeholderRow = document.createElement('tr');
                placeholderRow.id = 'placeholderRow';
                placeholderRow.className = 'placeholder-row';
                placeholderRow.innerHTML = `<td colspan="5" class="px-6 py-10 text-center text-slate-500 font-bold">No hay datos cargados. Ingrese un parámetro de búsqueda para empezar.</td>`;
                tableBody.appendChild(placeholderRow);
            }

            if (!query) {
                rows.forEach(r => r.style.display = 'none');
                placeholderRow.style.display = '';
                placeholderRow.querySelector('td').textContent = 'No hay datos cargados. Ingrese un parámetro de búsqueda para empezar.';
                return;
            }

            let visibleCount = 0;

            rows.forEach(row => {
                let matched = false;
                if (param === 'codigo') {
                    const cellText = row.cells[0].textContent.trim().toLowerCase();
                    matched = cellText.startsWith(query);
                } else if (param === 'nombre') {
                    const name = row.cells[1].querySelector('span')?.textContent.trim().toLowerCase() || '';
                    const dir = row.cells[1].querySelector('div')?.textContent.trim().toLowerCase() || '';
                    matched = name.startsWith(query) || dir.startsWith(query);
                } else if (param === 'ciudad') {
                    const cellText = row.cells[2].textContent.trim().toLowerCase();
                    matched = cellText.startsWith(query);
                } else if (param === 'estado') {
                    const cellText = row.cells[3].textContent.trim().toLowerCase();
                    matched = cellText.startsWith(query);
                }

                if (matched) {
                    row.style.display = 'table-row';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            if (visibleCount === 0) {
                placeholderRow.style.display = '';
                placeholderRow.querySelector('td').textContent = 'No se encontraron sucursales con el criterio de búsqueda.';
            } else {
                placeholderRow.style.display = 'none';
            }
        }

        // Initialize with default option select
        selectSearchParam('codigo');
    }
</script>
</body>
</html>
