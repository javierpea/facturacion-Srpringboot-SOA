<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --brand: #1B4FD8;
            --brand-dark: #1340B0;
            --navy: #0F172A;
            --indigo: #6366F1;
            --emerald: #10B981;
            --amber: #F59E0B;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .brand-gradient {
            background: linear-gradient(
                135deg,
                #0F172A 0%,
                #1B4FD8 60%,
                #6366F1 100%
            );
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>

<body class="min-h-screen text-slate-900 font-sans flex items-center justify-center px-4 py-8 overflow-hidden">

<!-- Fondo corporativo -->
<div class="fixed inset-0 -z-10">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-700"></div>

    <div class="absolute top-0 left-0 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>

    <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-indigo-500/20 rounded-full blur-3xl"></div>
</div>

<main class="w-full flex items-center justify-center min-h-screen">

    <!-- Formulario de login -->
    <section class="w-full max-w-md relative -top-20">

        <div class="mb-4 flex items-center gap-4 justify-center">
            <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-700 to-indigo-600 text-white shadow-xl shadow-blue-500/30">
                <i class="ti ti-bolt" style="font-size:22px"></i>
            </span>

            <div>
                <p class="font-black text-white text-sm leading-none">
                    SOFTWARE S.A.
                </p>

                <p class="text-xs text-blue-100 mt-0.5">
                    Facturación Electrónica
                </p>
            </div>
        </div>

        <div
                class="rounded-3xl border border-white/20 bg-white/95 backdrop-blur-md p-8 shadow-2xl">

            <div class="mb-5">
                <p
                        class="text-xs font-black uppercase tracking-widest text-blue-700 mb-2">
                    Autenticación segura
                </p>

                <h2
                        class="text-4xl font-black tracking-tight text-slate-900">
                    Bienvenido/a
                </h2>

                <p
                        class="mt-3 text-sm text-slate-600 leading-relaxed">
                    Ingresa tus credenciales para acceder al panel según tu rol
                    asignado.
                </p>
            </div>

            <!-- Error -->
            <div
                    th:if="${errorMensaje}"
                    class="mb-5 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 font-semibold flex items-center gap-2"
                    role="alert">

                <svg
                        class="w-4 h-4 flex-shrink-0"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2">

                    <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
                </svg>

                <span th:text="${errorMensaje}">
                    Error
                </span>
            </div>

            <!-- Formulario -->
            <form
                    th:action="@{/login}"
                    method="POST"
                    id="loginForm"
                    class="space-y-4"
                    novalidate>

                <div>
                    <label
                            for="username"
                            class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">

                        Usuario
                    </label>

                    <input
                            id="username"
                            name="username"
                            type="text"
                            required
                            autocomplete="username"
                            placeholder="usuario123"
                            class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition-all placeholder:text-slate-400 hover:border-blue-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-100" />

                    <p
                            id="username-error"
                            class="hidden mt-1.5 text-xs font-semibold text-red-600">
                    </p>
                </div>

                <div>
                    <label
                            for="password"
                            class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">

                        Contraseña
                    </label>

                    <div class="relative">

                        <input
                                id="password"
                                name="password"
                                type="password"
                                required
                                autocomplete="current-password"
                                placeholder="••••••••"
                                class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 pr-12 text-sm text-slate-900 outline-none transition-all placeholder:text-slate-400 hover:border-blue-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-100" />

                        <button
                                type="button"
                                id="togglePasswordBtn"
                                class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 hover:text-blue-700 transition-colors"
                                aria-label="Mostrar contraseña">

                            <svg
                                    id="eyeIcon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    class="h-5 w-5">

                                <path
                                        d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />

                                <circle
                                        cx="12"
                                        cy="12"
                                        r="3" />
                            </svg>

                        </button>

                    </div>

                    <p
                            id="password-error"
                            class="hidden mt-1.5 text-xs font-semibold text-red-600">
                    </p>
                </div>

                <button
                        type="submit"
                        id="submitBtn"
                        class="w-full rounded-2xl bg-gradient-to-r from-blue-700 to-indigo-600 py-3.5 text-sm font-black text-white shadow-xl shadow-blue-500/20 transition-all hover:scale-[1.02] hover:shadow-2xl hover:shadow-blue-500/30 focus:outline-none focus:ring-4 focus:ring-blue-200 disabled:opacity-60 disabled:cursor-not-allowed mt-2">

                    <span id="btnText">
                        Entrar al sistema
                    </span>

                </button>

            </form>

            <p class="mt-5 text-center text-xs text-slate-500">
                ¿Problemas con tu acceso? Contacta al Administrador de TI.
            </p>

        </div>

    </section>

</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {

        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        togglePasswordBtn.addEventListener('click', () => {

            if (passwordInput.type === 'password') {

                passwordInput.type = 'text';

                eyeIcon.innerHTML =
                    '<path d="M3 3l18 18"/><path d="M10.58 10.58A2 2 0 0012 14a2 2 0 001.42-.58"/><path d="M9.88 5.09A10.94 10.94 0 0112 5c5.52 0 9.5 5 10.5 7a20.29 20.29 0 01-4.04 5.38"/><path d="M6.1 6.1C3.69 7.68 2 10 1.5 12c1 2 4.98 7 10.5 7a11.4 11.4 0 004.3-.83"/>';

            } else {

                passwordInput.type = 'password';

                eyeIcon.innerHTML =
                    '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';

            }

        });

        form.addEventListener('submit', (e) => {

            let isValid = true;

            document.getElementById('username-error').classList.add('hidden');
            document.getElementById('password-error').classList.add('hidden');

            usernameInput.classList.remove('border-red-400');
            passwordInput.classList.remove('border-red-400');

            if (!usernameInput.value.trim()) {

                isValid = false;

                usernameInput.classList.add('border-red-400');

                const err = document.getElementById('username-error');

                err.textContent =
                    'Debes ingresar tu nombre de usuario.';

                err.classList.remove('hidden');
            }

            if (!passwordInput.value.trim()) {

                isValid = false;

                passwordInput.classList.add('border-red-400');

                const err = document.getElementById('password-error');

                err.textContent =
                    'Debes ingresar tu contraseña.';

                err.classList.remove('hidden');
            }

            if (!isValid) {

                e.preventDefault();

            } else {

                submitBtn.disabled = true;
                btnText.innerHTML = 'Verificando identidad...';

            }

        });

    });
</script>

</body>
</html>
