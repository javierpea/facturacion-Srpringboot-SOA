<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías de Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .animate-slide-down {
            animation: slideDown 0.25s ease-out forwards;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col">
<div th:replace="~{fragments/ui :: sidebar}"></div>
<div th:replace="~{fragments/ui :: toast}"></div>
<div th:replace="~{fragments/ui :: confirmacion}"></div>
<div class="ml-64 flex flex-col min-h-screen">
<header class="w-full bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shadow-sm sticky top-0 z-40">
    <div class="flex items-center gap-3">
        <a th:href="@{/dashboard}" class="flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-blue-700 transition-colors border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-300 hover:bg-blue-50">
            <i class="ti ti-arrow-left" style="font-size:14px"></i> Panel
        </a>
        <div class="h-5 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2.5">
            <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-600 text-white shadow-md shadow-blue-200">
                <i class="ti ti-folder" style="font-size:15px"></i>
            </span>
            <span class="font-black text-slate-900 text-base">Gestión de Categorías</span>
        </div>
    </div>
</header>

<main class="flex-1 p-6">
<div class="max-w-5xl mx-auto">

    <div th:if="${success}" class="mb-4 p-4 bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-2xl font-bold" th:text="${success}"></div>
    <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-200 text-red-800 rounded-2xl font-bold" th:text="${error}"></div>

    <!-- Top Card con Botón Nueva Categoría -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-black tracking-tight text-slate-950">Categorías del Sistema</h1>
            <p class="text-sm text-slate-500 mt-1">Administra la clasificación de tus productos.</p>
        </div>
        <button type="button" onclick="abrirModalCategoria()" class="inline-flex items-center gap-2 bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700 shadow-md shadow-blue-200 transition-all">
            <i class="ti ti-plus" style="font-size:15px"></i> Nueva Categoría
        </button>
    </div>

    <!-- Tabla de Categorías -->
    <div class="bg-white rounded-3xl border border-slate-200 shadow-md overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-900 text-white text-xs font-bold uppercase tracking-wider">
                    <th class="px-6 py-4">Categoría</th>
                    <th class="px-6 py-4">Tarifa IVA</th>
                    <th class="px-6 py-4 text-center">Estado</th>
                    <th class="px-6 py-4 text-center">Acciones</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                <tr th:each="c : ${categorias}" class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4">
                        <div class="font-bold text-slate-950" th:text="${c.nombre}"></div>
                        <div class="text-xs text-slate-400 font-normal mt-0.5" th:text="${c.descripcion ?: 'Sin descripción'}"></div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg"
                              th:text="${c.tarifaIva.porcentaje + '% - ' + c.tarifaIva.descripcion}"></span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span th:if="${c.activo}" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold">Activo</span>
                        <span th:unless="${c.activo}" class="px-2.5 py-1 bg-slate-200 text-slate-600 rounded-full text-xs font-bold">Inactivo</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button type="button"
                                    th:data-id="${c.id}"
                                    th:data-nombre="${c.nombre}"
                                    th:data-descripcion="${c.descripcion}"
                                    th:data-tarifa="${c.tarifaIva.id}"
                                    onclick="cargarDatosEdicion(this)"
                                    title="Editar"
                                    class="text-blue-600 hover:text-blue-800 p-2 rounded-xl hover:bg-blue-50 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                                </svg>
                            </button>
                            <form th:action="@{'/categorias/toggle/' + ${c.id}}" method="POST" style="display:inline;" onsubmit="confirmarToggle(event, this, '¿Desea cambiar el estado de esta categoría?')">
                                <button th:if="${c.activo}" type="submit" title="Desactivar" class="text-red-500 hover:text-red-700 p-2 rounded-xl hover:bg-red-50 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636" />
                                    </svg>
                                </button>
                                <button th:unless="${c.activo}" type="submit" title="Activar" class="text-emerald-500 hover:text-emerald-700 p-2 rounded-xl hover:bg-emerald-50 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

<!-- Modal de Categoría -->
<div id="modalCategoria" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-slide-down">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h3 id="formTitle" class="font-black text-slate-900 text-xl">Registrar Categoría</h3>
            <button type="button" onclick="cerrarModalCategoria()" class="text-slate-400 hover:text-red-500 text-2xl leading-none">&times;</button>
        </div>
        <form id="categoriaForm" th:action="@{/categorias/guardar}" th:object="${categoriaDto}" method="POST" class="p-6 space-y-4">
            <input type="hidden" id="categoriaId" th:field="*{id}"/>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nombre Categoría</label>
                <input type="text" th:field="*{nombre}" id="nombre" required
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-bold"
                       placeholder="Ej: Electrónicos" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras y espacios"/>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Descripción Breve</label>
                <input type="text" th:field="*{descripcion}" id="descripcion"
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm"
                       placeholder="Ej. Dispositivos electrónicos"/>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Tarifa de IVA Legal SRI</label>
                <input type="hidden" th:field="*{tarifaIvaId}" id="tarifaIvaId" />
                <div class="relative w-full">
                    <button type="button" id="customSelectTrigger"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold text-left flex justify-between items-center focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                        <span id="customSelectLabel">Seleccione una tarifa</span>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-slate-500 transition-transform duration-200" id="customSelectArrow">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                        </svg>
                    </button>
                    <div id="customSelectMenu"
                         class="absolute left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl hidden flex-col overflow-hidden z-50 animate-slide-down">
                        <div th:each="t : ${tarifasIva}" th:data-value="${t.id}"
                             class="custom-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer"
                             th:text="${t.descripcion + ' (' + t.porcentaje + '%)'}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 pt-4">
                <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 text-white rounded-xl py-3 font-black text-sm hover:bg-blue-700 shadow-md transition-colors">Guardar Categoría</button>
                <button type="button" onclick="cerrarModalCategoria()" class="px-6 bg-slate-200 text-slate-700 rounded-xl py-3 font-black text-sm hover:bg-slate-300 transition-colors">Cancelar</button>
            </div>
        </form>
    </div>
</div>
<script th:inline="javascript">
    const optionLabels = {};

    function initCustomSelect() {
        const trigger = document.getElementById('customSelectTrigger');
        const menu = document.getElementById('customSelectMenu');
        const hiddenInput = document.getElementById('tarifaIvaId');
        const label = document.getElementById('customSelectLabel');
        const arrow = document.getElementById('customSelectArrow');
        const options = document.querySelectorAll('.custom-option');

        // Populate optionLabels dynamically from options
        options.forEach(opt => {
            const val = opt.getAttribute('data-value');
            optionLabels[val] = opt.textContent.trim();
        });

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const isHidden = menu.classList.contains('hidden');
            if (isHidden) {
                openMenu();
            } else {
                closeMenu();
            }
        });

        function openMenu() {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            arrow.classList.add('rotate-180');
        }

        function closeMenu() {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
            arrow.classList.remove('rotate-180');
        }

        document.addEventListener('click', function() {
            closeMenu();
        });

        options.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const val = this.getAttribute('data-value');
                selectOption(val);
                closeMenu();
            });
        });

        window.selectOption = function(value) {
            hiddenInput.value = value;
            label.textContent = optionLabels[value] || 'Seleccione una tarifa';

            options.forEach(opt => {
                if (opt.getAttribute('data-value') == value) {
                    opt.classList.add('bg-blue-50', 'text-blue-600');
                } else {
                    opt.classList.remove('bg-blue-50', 'text-blue-600');
                }
            });
        };
    }

    function abrirModalCategoria() {
        resetForm();
        const modal = document.getElementById('modalCategoria');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function cerrarModalCategoria() {
        const modal = document.getElementById('modalCategoria');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function cargarDatosEdicion(btn) {
        const id = btn.getAttribute('data-id');
        const nombre = btn.getAttribute('data-nombre');
        const descripcion = btn.getAttribute('data-descripcion');
        const tarifaId = btn.getAttribute('data-tarifa');

        document.getElementById('categoriaId').value = id;
        document.getElementById('nombre').value = nombre;
        document.getElementById('descripcion').value = (descripcion === 'null' || !descripcion) ? '' : descripcion;

        selectOption(tarifaId);

        // Cambiar UI para edición
        document.getElementById('formTitle').innerText = 'Editar Categoría';
        document.getElementById('submitBtn').innerText = 'Actualizar Categoría';

        // Open Modal
        const modal = document.getElementById('modalCategoria');
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        // Cambiar action del form
        const baseUrl = /*[[ @{/categorias/actualizar/} ]]*/ '/categorias/actualizar/';
        document.getElementById('categoriaForm').action = baseUrl + id;
    }

    function resetForm() {
        document.getElementById('categoriaId').value = '';
        document.getElementById('categoriaForm').reset();
        
        // Reset Custom Select to default (first item)
        const options = document.querySelectorAll('.custom-option');
        if (options.length > 0) {
            selectOption(options[0].getAttribute('data-value'));
        }

        // Reset action
        const baseUrl = /*[[ @{/categorias/guardar} ]]*/ '/categorias/guardar';
        document.getElementById('categoriaForm').action = baseUrl;

        // Reset UI
        document.getElementById('formTitle').innerText = 'Registrar Categoría';
        document.getElementById('submitBtn').innerText = 'Guardar Categoría';
    }

    // Validación real-time: Solo letras y espacios en Nombre de Categoría
    document.getElementById('nombre').addEventListener('input', function() {
        let cleanVal = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        this.value = cleanVal;
    });

    document.addEventListener('DOMContentLoaded', () => {
        initCustomSelect();
        const currentVal = document.getElementById('tarifaIvaId').value;
        if (currentVal) {
            selectOption(currentVal);
        } else {
            const options = document.querySelectorAll('.custom-option');
            if (options.length > 0) {
                selectOption(options[0].getAttribute('data-value'));
            }
        }
    });
    // Función para confirmación de acciones directas
    function confirmarToggle(event, form, mensaje) {
        event.preventDefault();
        preguntarConfirmacion(mensaje, () => {
            form.submit();
        });
    }
</script>
</div>
</main>
</div>
</body>
</html>
