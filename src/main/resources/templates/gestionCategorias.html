<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"><title>Categorías de Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 p-6 font-sans">
<div class="max-w-4xl mx-auto">
    <div class="mb-6"><a th:href="@{/dashboard}" class="text-sm font-bold text-blue-600">← Volver al Dashboard</a></div>

    <div th:if="${success}" class="mb-4 p-4 bg-emerald-100 text-emerald-800 rounded-2xl font-bold" th:text="${success}"></div>
    <div th:if="${error}" class="mb-4 p-4 bg-red-100 text-red-800 rounded-2xl font-bold" th:text="${error}"></div>

    <div class="grid gap-6 md:grid-cols-[1fr_1.5fr]">
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm h-fit">
            <h2 class="text-xl font-black mb-4">Nueva Categoría</h2>
            <form th:action="@{/categorias/guardar}" th:object="${categoriaDto}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Nombre Categoría</label>
                    <input type="text" th:field="*{nombre}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold" placeholder="Ej: Electrónicos"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Descripción Breve</label>
                    <input type="text" th:field="*{descripcion}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Tarifa de IVA Legal SRI</label>
                    <select th:field="*{tarifaIvaId}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold">
                        <option th:each="t : ${tarifasIva}" th:value="${t.id}" th:text="${t.descripcion + ' (' + t.porcentaje + '%)'}"></option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-purple-600 text-white rounded-xl py-3 font-black text-sm hover:bg-purple-700 shadow-md">Crear Categoría</button>
            </form>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                    <th class="px-6 py-4">Categoría</th>
                    <th class="px-6 py-4">Tarifa IVA Asociada</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                <tr th:each="c : ${categorias}" class="hover:bg-slate-50">
                    <td class="px-6 py-4 font-bold text-slate-950" th:text="${c.nombre}"></td>
                    <td class="px-6 py-4 text-xs font-bold text-purple-700" th:text="${c.tarifaIva.descripcion + ' (' + c.tarifaIva.porcentaje + '%)'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
