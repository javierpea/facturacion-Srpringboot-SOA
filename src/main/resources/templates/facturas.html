<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Facturas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flatpickr CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <style>
        @keyframes slideDown {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-down {
            animation: slideDown 0.2s ease-out forwards;
        }
        /* Custom flatpickr styling */
        .flatpickr-calendar {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            font-family: inherit;
        }
        .flatpickr-day.selected, .flatpickr-day.selected:focus, .flatpickr-day.selected:hover {
            background: #2563eb !important;
            border-color: #2563eb !important;
            color: #ffffff;
            border-radius: 0.75rem;
        }
        .flatpickr-day:hover {
            background: #f1f5f9 !important;
            border-color: #f1f5f9 !important;
            color: #1e293b;
            border-radius: 0.75rem;
        }
        .flatpickr-day.today {
            border-color: #2563eb !important;
            color: #2563eb;
            border-radius: 0.75rem;
        }
        .flatpickr-day.today:hover {
            background: #f1f5f9 !important;
            color: #1e293b;
        }
        .flatpickr-months .flatpickr-month {
            color: #0f172a;
            font-weight: 800;
        }
        .flatpickr-current-month .flatpickr-monthDropdown-months {
            font-weight: 800;
        }
        .flatpickr-weekdays {
            background: #f8fafc;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
            padding: 4px 0;
        }
        span.flatpickr-weekday {
            color: #64748b;
            font-weight: 700;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="min-h-screen bg-slate-50 font-sans flex flex-col relative overflow-x-hidden">

<div th:replace="~{fragments/ui :: sidebar}"></div>
<div th:replace="~{fragments/ui :: toast}"></div>
<div th:replace="~{fragments/ui :: confirmacion}"></div>

<div class="ml-64 flex flex-col min-h-screen">
<header class="w-full bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shadow-sm sticky top-0 z-40">
    <div class="flex items-center gap-3">
        <a th:href="@{/dashboard}" class="flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-blue-700 transition-colors border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-300 hover:bg-blue-50">
            <i class="ti ti-arrow-left" style="font-size:14px"></i> Panel
        </a>
        <div class="h-5 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2.5">
            <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-600 text-white shadow-md shadow-blue-200">
                <i class="ti ti-file-invoice" style="font-size:15px"></i>
            </span>
            <span class="font-black text-slate-900 text-base">Facturas Emitidas</span>
        </div>
    </div>
</header>
<main class="flex-1 p-6">
<div class="max-w-7xl mx-auto">
    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mb-6">
        <h1 class="text-2xl font-black text-slate-900 mb-6">Listado de Comprobantes Electrónicos</h1>

        <!-- Buscador de Facturas Unificado -->
        <div class="flex flex-col md:flex-row gap-4 items-center">
            <div class="w-full md:w-1/3 relative">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Buscar por</label>
                <input type="hidden" id="searchParam" value="fecha" />
                <button type="button" id="searchParamTrigger" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold text-left flex justify-between items-center focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                    <span id="searchParamLabel">Fecha</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-slate-500 transition-transform duration-200" id="searchParamArrow">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
                <div id="searchParamMenu" class="absolute left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl hidden flex-col overflow-hidden z-50 animate-slide-down">
                    <div data-value="fecha" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                        Fecha
                    </div>
                    <div data-value="secuencial" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                        Secuencial
                    </div>
                    <div data-value="cliente" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                        Cliente
                    </div>
                    <div data-value="total" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                        Total
                    </div>
                    <div data-value="vendedor" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                        Vendedor
                    </div>
                    <div data-value="estadoSri" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                        Estado SRI
                    </div>
                </div>
            </div>
            <div class="w-full md:w-2/3">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Criterio de Búsqueda</label>
                <input type="text" id="searchInput" placeholder="Seleccione fecha..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-bold" />
            </div>
        </div>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-slate-900 text-white text-xs font-bold uppercase tracking-wider">
                <th class="px-6 py-4">Fecha</th>
                <th class="px-6 py-4">Secuencial</th>
                <th class="px-6 py-4">Cliente</th>
                <th class="px-6 py-4">Total</th>
                <th class="px-6 py-4">Vendedor</th>
                <th class="px-6 py-4">Estado SRI</th>
                <th class="px-6 py-4 text-center w-24">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
            <tr th:each="f : ${facturas}" class="hover:bg-slate-50 transition-colors" style="display: none;">
                <td class="px-6 py-4" th:text="${#temporals.format(f.venta.fechaEmision, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="px-6 py-4 font-black text-slate-900" th:text="${f.establecimiento + '-' + f.puntoEmision + '-' + f.secuencial}"></td>
                <td class="px-6 py-4">
                    <div class="flex flex-col">
                        <span class="font-bold text-slate-900" th:text="${f.venta.cliente.razonSocial}"></span>
                        <span class="text-xs text-slate-500" th:text="${f.venta.cliente.identificacion}"></span>
                    </div>
                </td>
                <td class="px-6 py-4 font-black text-blue-700" th:text="${'$ ' + f.venta.total}"></td>
                <td class="px-6 py-4 text-xs font-bold text-slate-500" th:text="${f.venta.usuario.username}"></td>
                <td class="px-6 py-4">
                    <span th:if="${f.estadoSri == 'AUTORIZADO'}" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-xs font-bold italic">Autorizado</span>
                    <span th:if="${f.estadoSri == 'OFFLINE'}" class="px-2.5 py-1 bg-amber-100 text-amber-700 rounded-lg text-xs font-bold">Offline</span>
                    <span th:if="${f.estadoSri == 'RECHAZADA'}" class="px-2.5 py-1 bg-red-100 text-red-700 rounded-lg text-xs font-bold">Rechazada</span>
                    <span th:if="${f.estadoSri != 'AUTORIZADO' && f.estadoSri != 'OFFLINE' && f.estadoSri != 'RECHAZADA'}" class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold" th:text="${f.estadoSri}"></span>
                </td>
                <td class="px-6 py-4 text-center">
                    <a th:href="@{'/api/facturas/pdf/' + ${f.id}}" target="_blank" title="Ver PDF" class="text-blue-600 hover:text-blue-800 p-2 rounded-xl hover:bg-blue-50 transition-colors inline-flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                        </svg>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(facturas)}" class="placeholder-row" id="serverPlaceholderRow">
                <td colspan="7" class="px-6 py-10 text-center text-slate-500 font-bold">No se encontraron facturas con los filtros aplicados.</td>
            </tr>
            </tbody>
        </table>
        </div>
    </div>
</div>

<script>
    let searchFlatpickr = null;

    document.addEventListener('DOMContentLoaded', () => {
        initDynamicSearch();
    });

    function initDynamicSearch() {
        const searchParam = document.getElementById('searchParam');
        const searchInput = document.getElementById('searchInput');

        const trigger = document.getElementById('searchParamTrigger');
        const menu = document.getElementById('searchParamMenu');
        const label = document.getElementById('searchParamLabel');
        const arrow = document.getElementById('searchParamArrow');
        const options = document.querySelectorAll('.search-option');
        const optionLabels = {
            'fecha': 'Fecha',
            'secuencial': 'Secuencial',
            'cliente': 'Cliente',
            'total': 'Total',
            'vendedor': 'Vendedor',
            'estadoSri': 'Estado SRI'
        };

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const isHidden = menu.classList.contains('hidden');
            if (isHidden) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
                arrow.classList.add('rotate-180');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                arrow.classList.remove('rotate-180');
            }
        });

        document.addEventListener('click', function() {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
            arrow.classList.remove('rotate-180');
        });

        options.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const val = this.getAttribute('data-value');
                selectSearchParam(val);
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                arrow.classList.remove('rotate-180');
            });
        });

        function selectSearchParam(value) {
            searchParam.value = value;
            label.textContent = optionLabels[value] || value;

            options.forEach(opt => {
                if (opt.getAttribute('data-value') === value) {
                    opt.classList.add('bg-blue-50', 'text-blue-600');
                } else {
                    opt.classList.remove('bg-blue-50', 'text-blue-600');
                }
            });

            if (searchFlatpickr) {
                searchFlatpickr.destroy();
                searchFlatpickr = null;
            }

            searchInput.value = '';
            searchInput.readOnly = false;
            searchInput.className = "w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-bold";

            updateSearchInputValidation();

            if (value === 'fecha') {
                initSearchFlatpickr();
            } else {
                filterFacturasTable();
            }
        }

        searchInput.addEventListener('input', () => {
            validateSearchInput();
            filterFacturasTable();
        });

        function updateSearchInputValidation() {
            const param = searchParam.value;
            if (param === 'fecha') {
                searchInput.placeholder = 'Seleccione fecha...';
            } else if (param === 'secuencial') {
                searchInput.placeholder = 'Ingrese secuencial (solo números y -)...';
            } else if (param === 'cliente') {
                searchInput.placeholder = 'Ingrese cliente (solo letras)...';
            } else if (param === 'total') {
                searchInput.placeholder = 'Ingrese total (solo números y .)...';
            } else if (param === 'vendedor') {
                searchInput.placeholder = 'Ingrese vendedor (solo letras)...';
            } else if (param === 'estadoSri') {
                searchInput.placeholder = 'Ingrese estado SRI (solo letras)...';
            }
        }

        function initSearchFlatpickr() {
            searchFlatpickr = flatpickr("#searchInput", {
                locale: "es",
                dateFormat: "d/m/Y",
                altInput: true,
                altFormat: "d/m/Y",
                altInputClass: "w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-bold cursor-pointer",
                allowInput: true,
                onReady: function(selectedDates, dateStr, instance) {
                    if (instance.altInput) {
                        instance.altInput.placeholder = "dd/mm/aaaa";
                        instance.altInput.addEventListener('input', function(e) {
                            let cleanVal = this.value.replace(/[^0-9/]/g, '');
                            this.value = cleanVal;
                            if (cleanVal.length === 10) {
                                instance.setDate(cleanVal, true, "d/m/Y");
                            } else {
                                filterFacturasTable();
                            }
                        });
                    }
                },
                onChange: function(selectedDates, dateStr, instance) {
                    filterFacturasTable();
                }
            });
        }

        // Initialize default
        selectSearchParam('fecha');
    }

    function validateSearchInput() {
        const searchParam = document.getElementById('searchParam');
        const searchInput = document.getElementById('searchInput');
        const param = searchParam.value;
        let val = searchInput.value;
        if (param === 'fecha') {
            val = val.replace(/[^0-9/]/g, '');
        } else if (param === 'secuencial') {
            val = val.replace(/[^0-9\-]/g, '');
        } else if (param === 'total') {
            val = val.replace(/[^0-9.]/g, '');
            const parts = val.split('.');
            if (parts.length > 2) {
                val = parts[0] + '.' + parts.slice(1).join('');
            }
        } else if (param === 'cliente' || param === 'vendedor' || param === 'estadoSri') {
            val = val.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        }
        searchInput.value = val;
    }

    function filterFacturasTable() {
        const searchParam = document.getElementById('searchParam');
        const searchInput = document.getElementById('searchInput');
        const param = searchParam.value;

        let query = '';
        if (param === 'fecha' && searchFlatpickr && searchFlatpickr.altInput) {
            query = searchFlatpickr.altInput.value.trim().toLowerCase();
        } else {
            query = searchInput.value.trim().toLowerCase();
        }

        const tableBody = document.querySelector('table tbody');
        const rows = Array.from(tableBody.querySelectorAll('tr:not(.placeholder-row)'));
        let placeholderRow = document.getElementById('placeholderRow');
        const serverPlaceholder = document.getElementById('serverPlaceholderRow');

        if (serverPlaceholder) {
            serverPlaceholder.style.display = 'none';
        }

        if (!placeholderRow) {
            placeholderRow = document.createElement('tr');
            placeholderRow.id = 'placeholderRow';
            placeholderRow.className = 'placeholder-row';
            placeholderRow.innerHTML = `<td colspan="7" class="px-6 py-10 text-center text-slate-500 font-bold">No hay datos cargados. Ingrese un parámetro de búsqueda para empezar.</td>`;
            tableBody.appendChild(placeholderRow);
        }

        if (!query) {
            rows.forEach(r => r.style.display = 'none');
            placeholderRow.style.display = '';
            placeholderRow.querySelector('td').textContent = 'No hay datos cargados. Ingrese un parámetro de búsqueda para empezar.';
            return;
        }

        let visibleCount = 0;

        rows.forEach(row => {
            let matched = false;
            if (param === 'fecha') {
                const cellText = row.cells[0].textContent.trim().toLowerCase();
                matched = cellText.startsWith(query);
            } else if (param === 'secuencial') {
                const cellText = row.cells[1].textContent.trim().toLowerCase();
                matched = cellText.startsWith(query);
            } else if (param === 'cliente') {
                const name = row.cells[2].querySelector('span.font-bold')?.textContent.trim().toLowerCase() || '';
                const ident = row.cells[2].querySelector('span.text-xs')?.textContent.trim().toLowerCase() || '';
                matched = name.startsWith(query) || ident.startsWith(query);
            } else if (param === 'total') {
                const cellText = row.cells[3].textContent.trim().toLowerCase();
                const cleanCell = cellText.replace(/[^0-9.]/g, '');
                const cleanQuery = query.replace(/[^0-9.]/g, '');
                matched = cleanCell.startsWith(cleanQuery);
            } else if (param === 'vendedor') {
                const cellText = row.cells[4].textContent.trim().toLowerCase();
                matched = cellText.startsWith(query);
            } else if (param === 'estadoSri') {
                const cellText = row.cells[5].textContent.trim().toLowerCase();
                matched = cellText.startsWith(query);
            }

            if (matched) {
                row.style.display = 'table-row';
                visibleCount++;
            } else {
                row.style.display = 'none';
            }
        });

        if (visibleCount === 0) {
            placeholderRow.style.display = '';
            placeholderRow.querySelector('td').textContent = 'No se encontraron facturas con el criterio de búsqueda.';
        } else {
            placeholderRow.style.display = 'none';
        }
    }
</script>
</div>
</main>
</div>
</body>
</html>
