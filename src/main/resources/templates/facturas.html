<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Facturas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flatpickr CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <style>
        @keyframes slideDown {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-down {
            animation: slideDown 0.2s ease-out forwards;
        }
        /* Custom flatpickr styling */
        .flatpickr-calendar {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            font-family: inherit;
        }
        .flatpickr-day.selected, .flatpickr-day.selected:focus, .flatpickr-day.selected:hover {
            background: #2563eb !important;
            border-color: #2563eb !important;
            color: #ffffff;
            border-radius: 0.75rem;
        }
        .flatpickr-day:hover {
            background: #f1f5f9 !important;
            border-color: #f1f5f9 !important;
            color: #1e293b;
            border-radius: 0.75rem;
        }
        .flatpickr-day.today {
            border-color: #2563eb !important;
            color: #2563eb;
            border-radius: 0.75rem;
        }
        .flatpickr-day.today:hover {
            background: #f1f5f9 !important;
            color: #1e293b;
        }
        .flatpickr-months .flatpickr-month {
            color: #0f172a;
            font-weight: 800;
        }
        .flatpickr-current-month .flatpickr-monthDropdown-months {
            font-weight: 800;
        }
        .flatpickr-weekdays {
            background: #f8fafc;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
            padding: 4px 0;
        }
        span.flatpickr-weekday {
            color: #64748b;
            font-weight: 700;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-6 font-sans flex flex-col relative overflow-x-hidden">
<div class="max-w-7xl mx-auto w-full">
<body class="min-h-screen bg-slate-50 p-6 font-sans">
<div th:replace="~{fragments/ui :: sidebar}"></div>
<div class="ml-64 flex flex-col min-h-screen">
<div class="max-w-7xl mx-auto">
    <div class="mb-6">
        <a th:href="@{/dashboard}" class="text-sm font-bold text-blue-600 hover:text-blue-800 transition-colors">← Volver al Dashboard</a>
    </div>

    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mb-6">
        <h1 class="text-2xl font-black text-slate-900 mb-6">Listado de Comprobantes Electrónicos</h1>

        <form th:action="@{/facturas}" method="GET" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4 items-end">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase px-1">Fecha Inicio</label>
                <div class="relative mt-1">
                    <input type="date" id="fechaInicio" name="fechaInicio" th:value="${fechaInicio}" class="datepicker hidden">
                    <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 z-10">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
                        </svg>
                    </span>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase px-1">Fecha Fin</label>
                <div class="relative mt-1">
                    <input type="date" id="fechaFin" name="fechaFin" th:value="${fechaFin}" class="datepicker hidden">
                    <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 z-10">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
                        </svg>
                    </span>
                </div>
            </div>

            <!-- Estado SRI (Custom Select Dropdown) -->
            <div class="relative">
                <label class="block text-xs font-bold text-slate-500 uppercase px-1">Estado SRI</label>
                <input type="hidden" name="estadoSri" id="estadoSri" th:value="${estadoSri}" />
                <button type="button" id="estadoSriTrigger" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 mt-1 outline-none text-sm font-bold text-left flex justify-between items-center focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                    <span id="estadoSriLabel">Todos</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5 text-slate-500 transition-transform duration-200" id="estadoSriArrow">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
                <div id="estadoSriMenu" class="absolute left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl hidden flex-col overflow-hidden z-50 animate-slide-down">
                    <div data-value="" class="estado-sri-option px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-blue-600 hover:text-white transition-colors cursor-pointer">Todos</div>
                    <div data-value="AUTORIZADO" class="estado-sri-option px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-blue-600 hover:text-white transition-colors cursor-pointer">Autorizado</div>
                    <div data-value="RECHAZADA" class="estado-sri-option px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-blue-600 hover:text-white transition-colors cursor-pointer">Rechazada</div>
                    <div data-value="OFFLINE" class="estado-sri-option px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-blue-600 hover:text-white transition-colors cursor-pointer">Offline</div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase px-1">Identificación Cliente</label>
                <input type="text" id="clienteIdentificacion" name="clienteIdentificacion" th:value="${clienteIdentificacion}" placeholder="RUC / Cédula" oninput="this.value = this.value.replace(/[^0-9]/g, '');" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 mt-1 outline-none text-sm font-bold text-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
            </div>
            <div class="lg:col-span-2 flex gap-2">
                <button type="submit" class="flex-1 bg-blue-600 text-white rounded-xl py-2.5 font-black text-sm hover:bg-blue-700 shadow-md transition-colors">Filtrar</button>
                <a th:href="@{/facturas}" class="px-4 bg-slate-100 text-slate-600 rounded-xl py-2.5 font-black text-sm hover:bg-slate-200 text-center transition-colors">Limpiar</a>
            </div>
        </form>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                <th class="px-6 py-4">Fecha</th>
                <th class="px-6 py-4">Secuencial</th>
                <th class="px-6 py-4">Cliente</th>
                <th class="px-6 py-4">Total</th>
                <th class="px-6 py-4">Vendedor</th>
                <th class="px-6 py-4">Estado SRI</th>
                <th class="px-6 py-4 text-center w-24">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
            <tr th:each="f : ${facturas}" class="hover:bg-slate-50 transition-colors">
                <td class="px-6 py-4" th:text="${#temporals.format(f.venta.fechaEmision, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="px-6 py-4 font-black text-slate-900" th:text="${f.establecimiento + '-' + f.puntoEmision + '-' + f.secuencial}"></td>
                <td class="px-6 py-4">
                    <div class="flex flex-col">
                        <span class="font-bold text-slate-900" th:text="${f.venta.cliente.razonSocial}"></span>
                        <span class="text-xs text-slate-500" th:text="${f.venta.cliente.identificacion}"></span>
                    </div>
                </td>
                <td class="px-6 py-4 font-black text-blue-700" th:text="${'$ ' + f.venta.total}"></td>
                <td class="px-6 py-4 text-xs font-bold text-slate-500" th:text="${f.venta.usuario.username}"></td>
                <td class="px-6 py-4">
                    <span th:if="${f.estadoSri == 'AUTORIZADO'}" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-xs font-bold italic">Autorizado</span>
                    <span th:if="${f.estadoSri == 'OFFLINE'}" class="px-2.5 py-1 bg-amber-100 text-amber-700 rounded-lg text-xs font-bold">Offline</span>
                    <span th:if="${f.estadoSri == 'RECHAZADA'}" class="px-2.5 py-1 bg-red-100 text-red-700 rounded-lg text-xs font-bold">Rechazada</span>
                    <span th:if="${f.estadoSri != 'AUTORIZADO' && f.estadoSri != 'OFFLINE' && f.estadoSri != 'RECHAZADA'}" class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold" th:text="${f.estadoSri}"></span>
                </td>
                <td class="px-6 py-4 text-center">
                    <a th:href="@{'/api/facturas/pdf/' + ${f.id}}" target="_blank" title="Ver PDF" class="text-blue-600 hover:text-blue-800 p-2 rounded-xl hover:bg-blue-50 transition-colors inline-flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                        </svg>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(facturas)}">
                <td colspan="7" class="px-6 py-10 text-center text-slate-500 font-bold">No se encontraron facturas con los filtros aplicados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Initialize Custom Datepickers using Flatpickr (Spanish locale)
        flatpickr(".datepicker", {
            locale: "es",
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "d/m/Y",
            altInputClass: "w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 pr-10 mt-1 outline-none text-sm font-bold text-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer",
            onReady: function(selectedDates, dateStr, instance) {
                if (instance.altInput) {
                    instance.altInput.placeholder = "dd/mm/aaaa";
                }
            }
        });

        // Initialize Custom Select for Estado SRI
        setupCustomSelect(
            'estadoSriTrigger', 'estadoSriMenu', 'estadoSri',
            'estadoSriLabel', 'estadoSriArrow', 'estado-sri-option',
            {
                '': 'Todos',
                'AUTORIZADO': 'Autorizado',
                'RECHAZADA': 'Rechazada',
                'OFFLINE': 'Offline'
            }
        );
    });

    function setupCustomSelect(triggerId, menuId, inputId, labelId, arrowId, optionClass, optionLabels) {
        const trigger = document.getElementById(triggerId);
        const menu = document.getElementById(menuId);
        const hiddenInput = document.getElementById(inputId);
        const label = document.getElementById(labelId);
        const arrow = document.getElementById(arrowId);
        const options = document.querySelectorAll('.' + optionClass);

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const isHidden = menu.classList.contains('hidden');
            closeAllCustomMenus();
            if (isHidden) {
                openMenu();
            }
        });

        function openMenu() {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            arrow.classList.add('rotate-180');
        }

        function closeMenu() {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
            arrow.classList.remove('rotate-180');
        }

        if (!window.customCloseFunctions) window.customCloseFunctions = [];
        window.customCloseFunctions.push(closeMenu);

        options.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const val = this.getAttribute('data-value');
                selectValue(val);
                closeMenu();
            });
        });

        function selectValue(value) {
            hiddenInput.value = value;
            label.textContent = optionLabels[value] || 'Todos';

            options.forEach(opt => {
                if (opt.getAttribute('data-value') == value) {
                    opt.className = `${optionClass} px-4 py-2.5 text-xs font-bold bg-blue-600 text-white transition-colors cursor-pointer`;
                } else {
                    opt.className = `${optionClass} px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-blue-600 hover:text-white transition-colors cursor-pointer`;
                }
            });
        }

        const initialVal = hiddenInput.value;
        selectValue(initialVal);

        window['select_' + inputId] = selectValue;
    }

    function closeAllCustomMenus() {
        if (window.customCloseFunctions) {
            window.customCloseFunctions.forEach(fn => fn());
        }
    }

    document.addEventListener('click', function() {
        closeAllCustomMenus();
    });
</script>
</div>
</body>
</html>
