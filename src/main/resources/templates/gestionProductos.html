<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"><title>Catálogo de Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 p-6 font-sans">
<div class="max-w-6xl mx-auto">
    <div class="mb-6"><a th:href="@{/dashboard}" class="text-sm font-bold text-blue-600">← Volver al Dashboard</a></div>

    <div th:if="${success}" class="mb-4 p-4 bg-emerald-100 text-emerald-800 rounded-2xl font-bold" th:text="${success}"></div>
    <div th:if="${error}" class="mb-4 p-4 bg-red-100 text-red-800 rounded-2xl font-bold" th:text="${error}"></div>

    <div class="grid gap-6 lg:grid-cols-[1fr_2fr]">
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm h-fit">
            <h2 class="text-xl font-black mb-4">Nuevo Producto</h2>
            <form th:action="@{/productos/guardar}" th:object="${productoDto}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Código Principal (Único)</label>
                    <input type="text" th:field="*{codigoPrincipal}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold" placeholder="Ejem: PROD-100"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Nombre Genérico del Producto</label>
                    <input type="text" th:field="*{nombreGenerico}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm" placeholder="Ej. Mouse Ergonómico"/>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Marca</label>
                        <input type="text" th:field="*{marca}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Presentación</label>
                        <input type="text" th:field="*{presentacion}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm" placeholder="Unidad, Caja, etc."/>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Precio Unitario (PVP)</label>
                    <input type="number" step="0.01" th:field="*{precioUnitario}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-black text-blue-700"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Categoría Impositiva (IVA)</label>
                    <select th:field="*{categoriaId}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold">
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre + ' (' + cat.tarifaIva.porcentaje + '%)'}"></option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-cyan-600 text-white rounded-xl py-3 font-black text-sm hover:bg-cyan-700 shadow-md">Registrar Producto</button>
            </form>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                    <th class="px-6 py-4">Código</th>
                    <th class="px-6 py-4">Descripción</th>
                    <th class="px-6 py-4">PVP</th>
                    <th class="px-6 py-4">IVA Aplicado</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                <tr th:each="p : ${productos}" class="hover:bg-slate-50">
                    <td class="px-6 py-4 font-bold text-slate-950" th:text="${p.codigoPrincipal}"></td>
                    <td class="px-6 py-4" th:text="${p.nombreGenerico + ' ' + (p.marca != null ? p.marca : '')}"></td>
                    <td class="px-6 py-4 font-black text-slate-950" th:text="${'$' + p.precioUnitario}"></td>
                    <td class="px-6 py-4 text-xs font-bold text-slate-500" th:text="${p.categoria.tarifaIva.descripcion}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
