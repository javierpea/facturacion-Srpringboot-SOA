<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .animate-slide-down {
            animation: slideDown 0.2s ease-out forwards;
        }
        /* Scrollbar personalizado para que sea siempre visible y estético */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
            margin: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col">
<div th:replace="~{fragments/ui :: sidebar}"></div>
<div class="ml-64 flex flex-col min-h-screen">

    <div th:replace="~{fragments/ui :: confirmacion}"></div>
    <div th:replace="~{fragments/ui :: toast}"></div>

    <header class="w-full bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shadow-sm sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <a th:href="@{/dashboard}" class="flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-blue-700 transition-colors border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-300 hover:bg-blue-50">
                <i class="ti ti-arrow-left" style="font-size:14px"></i> Panel
            </a>
            <div class="h-5 w-px bg-slate-200"></div>
            <div class="flex items-center gap-2.5">
            <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-600 text-white shadow-md shadow-blue-200">
                <i class="ti ti-tag" style="font-size:15px"></i>
            </span>
                <span class="font-black text-slate-900 text-base">Gestión de Productos</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">

        <div th:if="${success}" class="mb-4 p-4 bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-2xl font-bold" th:text="${success}"></div>
        <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-200 text-red-800 rounded-2xl font-bold" th:text="${error}"></div>

        <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-slate-950">Productos Registrados</h1>
                <p class="text-sm text-slate-500 mt-1">Administra los productos del inventario y sus categorías impositivas.</p>
            </div>
            <button type="button" onclick="abrirModalProducto()" class="inline-flex items-center gap-2 bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700 shadow-md shadow-blue-200 transition-all">
                <i class="ti ti-plus" style="font-size:15px"></i> Nuevo Producto
            </button>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center">
            <div class="w-full md:w-1/3 relative">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Buscar por</label>
                <input type="hidden" id="searchParam" value="codigo" />
                <button type="button" id="searchParamTrigger" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold text-left flex justify-between items-center focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                    <span id="searchParamLabel">Código Principal</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-slate-500 transition-transform duration-200" id="searchParamArrow">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
                <div id="searchParamMenu" class="absolute left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl hidden flex-col overflow-hidden z-50 animate-slide-down">
                    <div data-value="codigo" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">Código Principal</div>
                    <div data-value="descripcion" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">Descripción</div>
                    <div data-value="pvp" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">Precio Unitario (PVP)</div>
                    <div data-value="estado" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">Estado</div>
                </div>
            </div>
            <div class="w-full md:w-2/3">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Criterio de Búsqueda</label>
                <input type="text" id="searchInput" placeholder="Ingrese código..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-bold" />
            </div>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-slate-900 text-white text-xs font-bold uppercase tracking-wider">
                        <th class="px-6 py-4">Código</th>
                        <th class="px-6 py-4">Descripción</th>
                        <th class="px-6 py-4">PVP</th>
                        <th class="px-6 py-4 text-center">Estado</th>
                        <th class="px-6 py-4 text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                    <tr th:each="p : ${productos}" class="hover:bg-slate-50 transition-colors" style="display: none;">
                        <td class="px-6 py-4 font-bold text-slate-950" th:text="${p.codigoPrincipal}"></td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-slate-950" th:text="${p.nombreGenerico + ' ' + (p.marca != null ? p.marca : '')}"></div>
                            <div class="text-[10px] text-slate-400 font-bold uppercase mt-0.5" th:text="${p.categoria.nombre}"></div>
                        </td>
                        <td class="px-6 py-4 font-bold text-slate-950" th:text="${'$' + p.precioUnitario}"></td>
                        <td class="px-6 py-4 text-center">
                            <span th:if="${p.estado}" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold">Activo</span>
                            <span th:unless="${p.estado}" class="px-2.5 py-1 bg-slate-200 text-slate-600 rounded-full text-xs font-bold">Inactivo</span>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button type="button"
                                        th:data-id="${p.id}"
                                        th:data-codigo="${p.codigoPrincipal}"
                                        th:data-nombre="${p.nombreGenerico}"
                                        th:data-marca="${p.marca}"
                                        th:data-presentacion="${p.presentacion}"
                                        th:data-precio="${p.precioUnitario}"
                                        th:data-categoria="${p.categoria.id}"
                                        onclick="cargarDatosEdicionProducto(this)"
                                        title="Editar"
                                        class="text-blue-600 hover:text-blue-800 p-2 rounded-xl hover:bg-blue-50 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                                    </svg>
                                </button>
                                <form th:action="@{'/productos/toggle/' + ${p.id}}" method="POST" style="display:inline;" onsubmit="confirmarToggle(event, this, '¿Desea cambiar el estado?')">
                                    <button th:if="${p.estado}" type="submit" title="Desactivar" class="text-red-500 hover:text-red-700 p-2 rounded-xl hover:bg-red-50 transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636" /></svg>
                                    </button>
                                    <button th:unless="${p.estado}" type="submit" title="Activar" class="text-emerald-500 hover:text-emerald-700 p-2 rounded-xl hover:bg-emerald-50 transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div id="modalProducto" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-slide-down">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h3 id="formTitle" class="font-black text-slate-900 text-xl">Registrar Producto</h3>
            <button type="button" onclick="cerrarModalProducto()" class="text-slate-400 hover:text-red-500 text-2xl leading-none">&times;</button>
        </div>
        <form id="productoForm" th:action="@{/productos/guardar}" th:object="${productoDto}" method="POST" class="p-6 space-y-4">
            <input type="hidden" id="productoId" name="id" />
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Código Principal</label>
                <input type="text" th:field="*{codigoPrincipal}" id="codigoPrincipal" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm font-bold"/>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre Genérico</label>
                <input type="text" th:field="*{nombreGenerico}" id="nombreGenerico" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm"/>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Marca</label>
                    <input type="text" th:field="*{marca}" id="marca" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Presentación</label>
                    <input type="text" th:field="*{presentacion}" id="presentacion" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm"/>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Precio Unitario (PVP)</label>
                <input type="text" th:field="*{precioUnitario}" id="precioUnitario" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm font-black text-blue-600"/>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Categoría (IVA)</label>
                <input type="hidden" th:field="*{categoriaId}" id="categoriaId" />
                <div class="relative w-full" id="customSelectWrapper">
                    <div class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 flex justify-between items-center transition-all cursor-text focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100">
                        <input type="text" id="catSearchInput" placeholder="Seleccione o busque una categoría..." class="w-full bg-transparent outline-none text-sm font-bold text-slate-700 placeholder-slate-400" autocomplete="off">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-slate-500 transition-transform duration-200 flex-shrink-0" id="customSelectArrow"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
                    </div>
                    <div id="customSelectMenu" class="absolute left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl hidden flex-col overflow-hidden z-50 animate-slide-down">
                        <div id="optionsContainer" class="max-h-48 overflow-y-auto custom-scrollbar py-1">
                            <div th:each="cat : ${categorias}" th:data-value="${cat.id}" class="custom-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer" th:text="${cat.nombre + ' (' + cat.tarifaIva.porcentaje + '%)'}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 pt-4">
                <button type="submit" id="btnSubmit" class="flex-1 bg-blue-600 text-white rounded-xl py-3 font-black text-sm hover:bg-blue-700 shadow-md">Guardar Producto</button>
                <button type="button" onclick="cerrarModalProducto()" class="px-6 bg-slate-200 text-slate-700 rounded-xl py-3 font-black text-sm hover:bg-slate-300">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const optionLabels = {};

    window.selectOption = function(value) {
        const hiddenInput = document.getElementById('categoriaId');
        const searchInput = document.getElementById('catSearchInput');
        const options = document.querySelectorAll('.custom-option');

        if (!hiddenInput || !searchInput) return;

        hiddenInput.value = value;
        searchInput.value = optionLabels[value] || '';

        options.forEach(opt => {
            if (opt.getAttribute('data-value') == value) {
                opt.classList.add('bg-blue-50', 'text-blue-600');
            } else {
                opt.classList.remove('bg-blue-50', 'text-blue-600');
            }
        });
    };

    function initCustomSelect() {
        const wrapper = document.getElementById('customSelectWrapper');
        const searchInput = document.getElementById('catSearchInput');
        const menu = document.getElementById('customSelectMenu');
        const options = document.querySelectorAll('.custom-option');
        const arrow = document.getElementById('customSelectArrow');

        if (!wrapper || !menu) return;

        // Guardar los nombres de las categorías en un diccionario
        options.forEach(opt => { optionLabels[opt.getAttribute('data-value')] = opt.textContent.trim(); });

        function openMenu() {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            arrow?.classList.add('rotate-180');
        }

        function closeMenu() {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
            arrow?.classList.remove('rotate-180');

            // Si el usuario hace clic fuera sin elegir nada, restauramos el texto visual de la opción guardada
            const currentSelected = document.getElementById('categoriaId').value;
            if(currentSelected) {
                searchInput.value = optionLabels[currentSelected] || '';
            } else {
                searchInput.value = '';
            }
        }

        // Al hacer foco en el input: abrimos el menú, vaciamos el texto para que escriba, y mostramos todas las opciones
        searchInput.addEventListener('focus', function() {
            openMenu();
            this.value = '';
            filterOptions('');
        });

        // Al escribir: filtramos
        searchInput.addEventListener('input', function() {
            openMenu();
            filterOptions(this.value);
        });

        function filterOptions(query) {
            const q = query.toLowerCase();
            options.forEach(opt => {
                opt.style.display = opt.textContent.toLowerCase().includes(q) ? 'block' : 'none';
            });
        }

        // Cerrar al hacer clic fuera del combobox
        document.addEventListener('click', (e) => {
            if (!wrapper.contains(e.target)) {
                closeMenu();
            }
        });

        // Seleccionar una opción de la lista
        options.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                selectOption(this.getAttribute('data-value'));
                closeMenu();
            });
        });
    }

    window.abrirModalProducto = function() {
        resetForm();
        const modal = document.getElementById('modalProducto');
        modal.classList.remove('hidden'); modal.classList.add('flex');
    };

    window.cerrarModalProducto = function() {
        const modal = document.getElementById('modalProducto');
        modal.classList.add('hidden'); modal.classList.remove('flex');
    };

    window.cargarDatosEdicionProducto = function(btnElement) {
        const id = btnElement.getAttribute('data-id');
        const codigo = btnElement.getAttribute('data-codigo');
        const nombre = btnElement.getAttribute('data-nombre');
        const marca = btnElement.getAttribute('data-marca');
        const presentacion = btnElement.getAttribute('data-presentacion');
        const precio = btnElement.getAttribute('data-precio');
        const catId = btnElement.getAttribute('data-categoria');
        prepararEdicion(id, codigo, nombre, marca, presentacion, precio, catId);
    };

    function prepararEdicion(id, codigo, nombre, marca, presentacion, precio, catId) {
        document.getElementById('formTitle').innerText = 'Editar Producto';
        document.getElementById('productoForm').action = '/productos/actualizar/' + id;
        const cp = document.getElementById('codigoPrincipal');
        cp.value = codigo; cp.readOnly = true; cp.classList.add('bg-slate-200', 'cursor-not-allowed');
        document.getElementById('nombreGenerico').value = nombre;
        document.getElementById('marca').value = (marca === 'null' || !marca) ? '' : marca;
        document.getElementById('presentacion').value = (presentacion === 'null' || !presentacion) ? '' : presentacion;
        document.getElementById('precioUnitario').value = precio;
        selectOption(catId);
        document.getElementById('btnSubmit').innerText = 'Actualizar Producto';
        const modal = document.getElementById('modalProducto');
        modal.classList.remove('hidden'); modal.classList.add('flex');
    }

    function resetForm() {
        document.getElementById('productoForm').action = '/productos/guardar';
        const cp = document.getElementById('codigoPrincipal');
        cp.value = ''; cp.readOnly = false; cp.classList.remove('bg-slate-200', 'cursor-not-allowed');
        document.getElementById('productoForm').reset();
        const options = document.querySelectorAll('.custom-option');
        if (options.length > 0) selectOption(options[0].getAttribute('data-value'));
        document.getElementById('formTitle').innerText = 'Registrar Producto';
        document.getElementById('btnSubmit').innerText = 'Guardar Producto';
    }

    document.getElementById('presentacion').addEventListener('input', function() {
        this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
    });

    document.getElementById('precioUnitario').addEventListener('input', function() {
        let val = this.value.replace(/[^0-9.]/g, '');
        const parts = val.split('.');
        this.value = parts.length > 2 ? parts[0] + '.' + parts.slice(1).join('') : val;
    });

    document.addEventListener('DOMContentLoaded', () => {
        initCustomSelect();
        initDynamicSearch();
        const initialCat = document.getElementById('categoriaId').value;
        if (initialCat) selectOption(initialCat);
        else {
            const options = document.querySelectorAll('.custom-option');
            if (options.length > 0) selectOption(options[0].getAttribute('data-value'));
        }
    });

    function initDynamicSearch() {
        const searchParam = document.getElementById('searchParam');
        const searchInput = document.getElementById('searchInput');
        const trigger = document.getElementById('searchParamTrigger');
        const menu = document.getElementById('searchParamMenu');
        const label = document.getElementById('searchParamLabel');
        const arrow = document.getElementById('searchParamArrow');
        const options = document.querySelectorAll('.search-option');
        const optionLabelsMap = { 'codigo': 'Código Principal', 'descripcion': 'Descripción', 'pvp': 'Precio Unitario (PVP)', 'estado': 'Estado' };

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            if (menu.classList.contains('hidden')) { menu.classList.remove('hidden'); menu.classList.add('flex'); arrow.classList.add('rotate-180'); }
            else { menu.classList.add('hidden'); menu.classList.remove('flex'); arrow.classList.remove('rotate-180'); }
        });
        document.addEventListener('click', () => { menu.classList.add('hidden'); menu.classList.remove('flex'); arrow.classList.remove('rotate-180'); });
        options.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const val = this.getAttribute('data-value');
                searchParam.value = val;
                label.textContent = optionLabelsMap[val];
                options.forEach(o => o.classList.toggle('bg-blue-50', o === this));
                searchInput.value = ''; filterProductosTable();
                menu.classList.add('hidden'); menu.classList.remove('flex'); arrow.classList.remove('rotate-180');
            });
        });

        searchInput.addEventListener('input', filterProductosTable);

        function filterProductosTable() {
            const param = searchParam.value;
            const query = searchInput.value.trim().toLowerCase();
            const tableBody = document.querySelector('table tbody');
            const rows = Array.from(tableBody.querySelectorAll('tr:not(.placeholder-row)'));
            let placeholderRow = document.getElementById('placeholderRow');
            if (!placeholderRow) {
                placeholderRow = document.createElement('tr'); placeholderRow.id = 'placeholderRow'; placeholderRow.className = 'placeholder-row';
                placeholderRow.innerHTML = `<td colspan="5" class="px-6 py-10 text-center text-slate-500 font-bold">No hay datos cargados.</td>`;
                tableBody.appendChild(placeholderRow);
            }
            if (!query) { rows.forEach(r => r.style.display = 'none'); placeholderRow.style.display = ''; return; }
            let count = 0;
            rows.forEach(row => {
                let matched = false;
                if (param === 'codigo') matched = row.cells[0].textContent.trim().toLowerCase().startsWith(query);
                else if (param === 'descripcion') matched = row.cells[1].textContent.toLowerCase().includes(query);
                else if (param === 'pvp') matched = row.cells[2].textContent.replace(/[^0-9.]/g, '').startsWith(query.replace(/[^0-9.]/g, ''));

                // CORRECCIÓN APLICADA AQUÍ ABAJO (agregado el .trim())
                else if (param === 'estado') matched = row.cells[3].textContent.trim().toLowerCase().startsWith(query);

                row.style.display = matched ? 'table-row' : 'none';
                if (matched) count++;
            });
            placeholderRow.style.display = count === 0 ? '' : 'none';
        }
    }

    window.confirmarToggle = function(event, form, mensaje) {
        event.preventDefault();
        preguntarConfirmacion(mensaje, () => { form.submit(); });
    };
</script>
</body>
</html>
