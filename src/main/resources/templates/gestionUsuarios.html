<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col">

<header class="w-full bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-4">
        <a th:href="@{/dashboard}" class="text-sm font-bold text-blue-600 hover:text-blue-800 transition-colors">← Volver al Panel</a>
        <div class="h-4 w-[1px] bg-slate-300"></div>
        <div class="flex items-center gap-2 font-bold text-slate-900 text-lg">
            <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-indigo-600 text-white font-black text-sm">👤</span>
            <span>Gestión de Usuarios</span>
        </div>
    </div>
</header>

<main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">

    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-black tracking-tight text-slate-950">Usuarios del Sistema</h1>
            <p class="text-sm text-slate-500 mt-1">Administra los accesos, roles y el estado de las cuentas de usuario.</p>
        </div>
        <button onclick="abrirModalUsuario()" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold text-sm hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all">
            + Nuevo Usuario
        </button>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-md overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                    <th class="px-6 py-4">Usuario</th>
                    <th class="px-6 py-4">Rol</th>
                    <th class="px-6 py-4 text-center">Estado</th>
                    <th class="px-6 py-4 text-center">Acciones</th>
                </tr>
                </thead>
                <tbody id="usuariosTableBody" class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                <!-- Se carga vía Fetch -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal de Usuario -->
<div id="modalUsuario" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-slide-down">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h3 id="modalTitulo" class="font-black text-slate-900 text-xl">Registrar Usuario</h3>
            <button onclick="cerrarModalUsuario()" class="text-slate-400 hover:text-red-500 text-2xl leading-none">&times;</button>
        </div>
        <form id="usuarioForm" class="p-6 space-y-4">
            <input type="hidden" id="usuarioId">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nombre de Usuario</label>
                <input type="text" id="username" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 text-sm font-bold">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Contraseña</label>
                <input type="password" id="password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 text-sm font-bold" placeholder="Dejar vacío para no cambiar (si edita)">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Rol Asignado</label>
                <select id="rolId" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 text-sm font-bold">
                    <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
                </select>
            </div>
            <div class="pt-4">
                <button type="submit" class="w-full bg-indigo-600 text-white rounded-2xl py-4 font-black text-sm hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', cargarUsuarios);

    async function cargarUsuarios() {
        const res = await fetch('/api/usuarios');
        const usuarios = await res.json();
        const tbody = document.getElementById('usuariosTableBody');
        tbody.innerHTML = '';

        usuarios.forEach(u => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50 transition-colors';
            tr.innerHTML = `
                <td class="px-6 py-4 font-bold text-slate-950">${u.username}</td>
                <td class="px-6 py-4"><span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg text-xs font-black uppercase">${u.rol.nombre}</span></td>
                <td class="px-6 py-4 text-center">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${u.activo ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
                        ${u.activo ? 'Activo' : 'Inactivo'}
                    </span>
                </td>
                <td class="px-6 py-4 text-center">
                    <div class="flex items-center justify-center gap-3">
                        <button onclick='editarUsuario(${JSON.stringify(u)})' class="text-blue-600 hover:underline font-bold text-xs">Editar</button>
                        <button onclick="toggleEstado(${u.id})" class="text-slate-400 hover:text-slate-900 font-bold text-xs">
                            ${u.activo ? 'Desactivar' : 'Activar'}
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function abrirModalUsuario() {
        document.getElementById('usuarioId').value = '';
        document.getElementById('usuarioForm').reset();
        document.getElementById('modalTitulo').textContent = 'Registrar Usuario';
        document.getElementById('modalUsuario').classList.remove('hidden');
        document.getElementById('modalUsuario').classList.add('flex');
    }

    function cerrarModalUsuario() {
        document.getElementById('modalUsuario').classList.add('hidden');
        document.getElementById('modalUsuario').classList.remove('flex');
    }

    function editarUsuario(u) {
        document.getElementById('usuarioId').value = u.id;
        document.getElementById('username').value = u.username;
        document.getElementById('rolId').value = u.rol.id;
        document.getElementById('modalTitulo').textContent = 'Editar Usuario';
        document.getElementById('modalUsuario').classList.remove('hidden');
        document.getElementById('modalUsuario').classList.add('flex');
    }

    async function toggleEstado(id) {
        if (!confirm('¿Desea cambiar el estado de este usuario?')) return;
        const res = await fetch(`/api/usuarios/${id}/toggle`, { method: 'POST' });
        if (res.ok) cargarUsuarios();
    }

    document.getElementById('usuarioForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('usuarioId').value;
        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            rolId: document.getElementById('rolId').value
        };

        const url = id ? `/api/usuarios/${id}` : '/api/usuarios';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            cerrarModalUsuario();
            cargarUsuarios();
        } else {
            const err = await res.json();
            alert(err.message || 'Error al guardar usuario');
        }
    });
</script>

</body>
</html>
