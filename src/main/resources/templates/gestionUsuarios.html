<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .animate-slide-down {
            animation: slideDown 0.25s ease-out forwards;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col">
<div th:replace="~{fragments/ui :: sidebar}"></div>
<div class="ml-64 flex flex-col min-h-screen">
<div th:replace="~{fragments/ui :: confirmacion}"></div>

<header class="w-full bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shadow-sm sticky top-0 z-40">
    <div class="flex items-center gap-3">
        <a th:href="@{/dashboard}" class="flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-blue-700 transition-colors border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-300 hover:bg-blue-50">
            <i class="ti ti-arrow-left" style="font-size:14px"></i> Panel
        </a>
        <div class="h-5 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2.5">
            <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-600 text-white shadow-md shadow-blue-200">
                <i class="ti ti-user-cog" style="font-size:15px"></i>
            </span>
            <span class="font-black text-slate-900 text-base">Gestión de Usuarios</span>
        </div>
    </div>
</header>

<main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">

    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-black tracking-tight text-slate-950">Usuarios del Sistema</h1>
            <p class="text-sm text-slate-500 mt-1">Administra los accesos, roles y el estado de las cuentas de usuario.</p>
        </div>
        <button onclick="abrirModalUsuario()" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold text-sm hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">
            <i class="ti ti-plus" style="font-size:15px"></i> Nuevo Usuario
        </button>
    </div>

    <!-- Buscador de Usuarios -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center">
        <div class="w-full md:w-1/3 relative">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Buscar por</label>
            <input type="hidden" id="searchParam" value="usuario" />
            <button type="button" id="searchParamTrigger" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold text-left flex justify-between items-center focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                <span id="searchParamLabel">Usuario</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-slate-500 transition-transform duration-200" id="searchParamArrow">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <div id="searchParamMenu" class="absolute left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl hidden flex-col overflow-hidden z-50 animate-slide-down">
                <div data-value="usuario" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                    Usuario
                </div>
                <div data-value="rol" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                    Rol
                </div>
                <div data-value="estado" class="search-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer">
                    Estado
                </div>
            </div>
        </div>
        <div class="w-full md:w-2/3">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Criterio de Búsqueda</label>
            <input type="text" id="searchInput" placeholder="Ingrese nombre de usuario (solo letras)..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-bold" />
        </div>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-md overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-900 text-white text-xs font-bold uppercase tracking-wider">
                    <th class="px-6 py-4">Usuario</th>
                    <th class="px-6 py-4">Rol</th>
                    <th class="px-6 py-4 text-center">Estado</th>
                    <th class="px-6 py-4 text-center">Acciones</th>
                </tr>
                </thead>
                <tbody id="usuariosTableBody" class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                <!-- Se carga vía Fetch -->
                </tbody>
            </table>
        </div>
    </div>
</main>
</div>
<!-- Modal de Usuario -->
<div id="modalUsuario" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-slide-down">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h3 id="modalTitulo" class="font-black text-slate-900 text-xl">Registrar Usuario</h3>
            <button onclick="cerrarModalUsuario()" class="text-slate-400 hover:text-red-500 text-2xl leading-none">&times;</button>
        </div>
        <form id="usuarioForm" class="p-6 space-y-4">
            <input type="hidden" id="usuarioId">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nombre de Usuario</label>
                <input type="text" id="username" required
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 text-sm font-bold"
                       placeholder="Ej. Juan Perez" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras y espacios">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Contraseña</label>
                    <input type="password" id="password"
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 text-sm font-bold"
                           placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword"
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 text-sm font-bold"
                           placeholder="••••••••">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Rol Asignado</label>
                <input type="hidden" id="rolId" />
                <div class="relative w-full">
                    <button type="button" id="customSelectTrigger"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold text-left flex justify-between items-center focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                        <span id="customSelectLabel">Seleccione un rol</span>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-slate-500 transition-transform duration-200" id="customSelectArrow">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                        </svg>
                    </button>
                    <div id="customSelectMenu"
                         class="absolute left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl hidden flex-col overflow-hidden z-50 animate-slide-down">
                        <div th:each="r : ${roles}" th:data-value="${r.id}"
                             class="custom-option px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer"
                             th:text="${r.nombre}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="pt-4 flex gap-2">
                <button type="submit" class="flex-1 bg-blue-600 text-white rounded-xl py-3.5 font-black text-sm hover:bg-blue-700 shadow-md transition-all">
                    Guardar Cambios
                </button>
                <button type="button" onclick="cerrarModalUsuario()" class="px-6 bg-slate-200 text-slate-700 rounded-xl py-3.5 font-black text-sm hover:bg-slate-300 transition-colors">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const currentUsername = /*[[${currentUsername}]]*/ '';
    const optionLabels = {};

    document.addEventListener('DOMContentLoaded', () => {
        initCustomSelect();
        initDynamicSearch();
        cargarUsuarios();
    });

    function initCustomSelect() {
        const trigger = document.getElementById('customSelectTrigger');
        const menu = document.getElementById('customSelectMenu');
        const hiddenInput = document.getElementById('rolId');
        const label = document.getElementById('customSelectLabel');
        const arrow = document.getElementById('customSelectArrow');
        const options = document.querySelectorAll('.custom-option');

        options.forEach(opt => {
            const val = opt.getAttribute('data-value');
            optionLabels[val] = opt.textContent.trim();
        });

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const isHidden = menu.classList.contains('hidden');
            if (isHidden) {
                openMenu();
            } else {
                closeMenu();
            }
        });

        function openMenu() {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            arrow.classList.add('rotate-180');
        }

        function closeMenu() {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
            arrow.classList.remove('rotate-180');
        }

        document.addEventListener('click', function() {
            closeMenu();
        });

        options.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const val = this.getAttribute('data-value');
                selectOption(val);
                closeMenu();
            });
        });

        window.selectOption = function(value) {
            hiddenInput.value = value;
            label.textContent = optionLabels[value] || 'Seleccione un rol';

            options.forEach(opt => {
                if (opt.getAttribute('data-value') == value) {
                    opt.classList.add('bg-blue-50', 'text-blue-600');
                } else {
                    opt.classList.remove('bg-blue-50', 'text-blue-600');
                }
            });
        };
    }

       let allUsuarios = [];

    async function cargarUsuarios() {
        const res = await fetch('/api/usuarios');
        allUsuarios = await res.json();
        filterUsuariosTable();
    }

    function initDynamicSearch() {
        const searchParam = document.getElementById('searchParam');
        const searchInput = document.getElementById('searchInput');

        // Setup custom search selector menu behavior
        const trigger = document.getElementById('searchParamTrigger');
        const menu = document.getElementById('searchParamMenu');
        const label = document.getElementById('searchParamLabel');
        const arrow = document.getElementById('searchParamArrow');
        const options = document.querySelectorAll('.search-option');
        const optionLabels = {
            'usuario': 'Usuario',
            'rol': 'Rol',
            'estado': 'Estado'
        };

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const isHidden = menu.classList.contains('hidden');
            if (isHidden) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
                arrow.classList.add('rotate-180');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                arrow.classList.remove('rotate-180');
            }
        });

        document.addEventListener('click', function() {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
            arrow.classList.remove('rotate-180');
        });

        options.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const val = this.getAttribute('data-value');
                selectSearchParam(val);
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                arrow.classList.remove('rotate-180');
            });
        });

        function selectSearchParam(value) {
            searchParam.value = value;
            label.textContent = optionLabels[value] || value;

            options.forEach(opt => {
                if (opt.getAttribute('data-value') === value) {
                    opt.classList.add('bg-blue-50', 'text-blue-600');
                } else {
                    opt.classList.remove('bg-blue-50', 'text-blue-600');
                }
            });

            searchInput.value = '';
            updateSearchInputValidation();
            filterUsuariosTable();
        }

        searchInput.addEventListener('input', () => {
            validateSearchInput();
            filterUsuariosTable();
        });

        function updateSearchInputValidation() {
            const param = searchParam.value;
            if (param === 'usuario') {
                searchInput.placeholder = 'Ingrese nombre de usuario (solo letras)...';
            } else if (param === 'rol') {
                searchInput.placeholder = 'Ingrese rol (solo letras)...';
            } else if (param === 'estado') {
                searchInput.placeholder = 'Ingrese estado (activo/inactivo - solo letras)...';
            }
        }

        function validateSearchInput() {
            let val = searchInput.value;
            // usuario, rol, estado are all only letters
            val = val.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
            searchInput.value = val;
        }

        window.filterUsuariosTable = function() {
            const param = searchParam.value;
            const query = searchInput.value.trim().toLowerCase();

            const tbody = document.getElementById('usuariosTableBody');
            tbody.innerHTML = '';

            if (!query) {
                const tr = document.createElement('tr');
                tr.className = 'placeholder-row';
                tr.innerHTML = `<td colspan="4" class="px-6 py-10 text-center text-slate-500 font-bold">No hay datos cargados. Ingrese un parámetro de búsqueda para empezar.</td>`;
                tbody.appendChild(tr);
                return;
            }

            const filtered = allUsuarios.filter(u => {
                let val = '';
                if (param === 'usuario') {
                    val = u.username || '';
                } else if (param === 'rol') {
                    val = u.rol?.nombre || '';
                } else if (param === 'estado') {
                    val = u.activo ? 'activo' : 'inactivo';
                }
                return val.toLowerCase().startsWith(query);
            });

            if (filtered.length === 0) {
                const tr = document.createElement('tr');
                tr.className = 'placeholder-row';
                tr.innerHTML = `<td colspan="4" class="px-6 py-10 text-center text-slate-500 font-bold">No se encontraron usuarios con el criterio de búsqueda.</td>`;
                tbody.appendChild(tr);
                return;
            }

            filtered.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors';
                
                const isSelf = u.username === currentUsername;
                
                let actionsContent = '';
                if (isSelf) {
                    actionsContent = `<span class="text-slate-400 font-bold text-xs italic">No editable</span>`;
                } else {
                    actionsContent = `
                        <button type="button" onclick="editarUsuario(${u.id}, '${u.username}', ${u.rol.id})" title="Editar" class="text-blue-600 hover:text-blue-800 p-2 rounded-xl hover:bg-blue-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                            </svg>
                        </button>
                        <button type="button" onclick="toggleEstado(${u.id})" title="${u.activo ? 'Desactivar' : 'Activar'}" class="${u.activo ? 'text-red-500 hover:text-red-700 hover:bg-red-50' : 'text-emerald-500 hover:text-emerald-700 hover:bg-emerald-50'} p-2 rounded-xl transition-colors">
                            ${u.activo ?
                                `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                     <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636" />
                                 </svg>`
                                :
                                `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                     <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                 </svg>`
                            }
                        </button>
                    `;
                }

                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-slate-950">${u.username} ${isSelf ? '<span class="ml-2 text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full uppercase">Tú</span>' : ''}</td>
                    <td class="px-6 py-4"><span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-lg text-xs font-black uppercase">${u.rol.nombre}</span></td>
                    <td class="px-6 py-4 text-center">
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold ${u.activo ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
                            ${u.activo ? 'Activo' : 'Inactivo'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            ${actionsContent}
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initialize with default option select
        selectSearchParam('usuario');
    }

    function abrirModalUsuario() {
        document.getElementById('usuarioId').value = '';
        document.getElementById('usuarioForm').reset();
        document.getElementById('password').value = '';
        document.getElementById('confirmPassword').value = '';

        // Reset custom select to first option
        const options = document.querySelectorAll('.custom-option');
        if (options.length > 0) {
            selectOption(options[0].getAttribute('data-value'));
        }

        document.getElementById('modalTitulo').textContent = 'Registrar Usuario';
        document.getElementById('modalUsuario').classList.remove('hidden');
        document.getElementById('modalUsuario').classList.add('flex');
    }

    function cerrarModalUsuario() {
        document.getElementById('modalUsuario').classList.add('hidden');
        document.getElementById('modalUsuario').classList.remove('flex');
    }

    function editarUsuario(id, username, rolId) {
        document.getElementById('usuarioId').value = id;
        document.getElementById('username').value = username;
        document.getElementById('password').value = ''; // clear password input for security
        document.getElementById('confirmPassword').value = ''; // clear confirm password input too

        selectOption(rolId);

        document.getElementById('modalTitulo').textContent = 'Editar Usuario';
        document.getElementById('modalUsuario').classList.remove('hidden');
        document.getElementById('modalUsuario').classList.add('flex');
    }

    function toggleEstado(id) {
        preguntarConfirmacion('¿Desea cambiar el estado de este usuario?', async () => {
            const res = await fetch(`/api/usuarios/${id}/toggle`, { method: 'POST' });
            if (res.ok) cargarUsuarios();
        });
    }

    document.getElementById('usuarioForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('usuarioId').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Validaciones de contraseña
        if (!id) {
            // Nuevo usuario: contraseña y confirmación son obligatorias y deben coincidir
            if (!password) {
                mostrarAlerta('Error', 'La contraseña es obligatoria para un nuevo usuario.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                mostrarAlerta('Error', 'Las contraseñas no coinciden.', 'error');
                return;
            }
        } else {
            // Editar usuario: si se ingresa contraseña o confirmación, deben coincidir
            if (password || confirmPassword) {
                if (password !== confirmPassword) {
                    mostrarAlerta('Error', 'Las contraseñas no coinciden.', 'error');
                    return;
                }
            }
        }

        const payload = {
            username: document.getElementById('username').value,
            password: password,
            rolId: document.getElementById('rolId').value
        };

        const url = id ? `/api/usuarios/${id}` : '/api/usuarios';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            cerrarModalUsuario();
            cargarUsuarios();
        } else {
            const err = await res.json();
            mostrarAlerta('Error', err.message || 'Error al guardar usuario', 'error');
        }
    });

    // Filtros de entrada en tiempo real: Nombre de usuario solo letras
    document.getElementById('username').addEventListener('input', function() {
        let cleanVal = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        this.value = cleanVal;
    });
</script>

</body>
</html>
