<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"><title>Mantenimiento de Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 p-6 font-sans">
<div class="max-w-6xl mx-auto">
    <div class="mb-6"><a th:href="@{/dashboard}" class="text-sm font-bold text-blue-600">← Volver al Dashboard</a></div>

    <div th:if="${success}" class="mb-4 p-4 bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-2xl font-bold" th:text="${success}"></div>
    <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-200 text-red-800 rounded-2xl font-bold" th:text="${error}"></div>

    <div class="grid gap-6 lg:grid-cols-[1fr_2fr]">
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm h-fit">
            <h2 id="formTitle" class="text-xl font-black mb-4">Registrar Cliente</h2>
            <form id="clienteForm" th:action="@{/clientes/guardar}" th:object="${clienteDto}" method="POST" class="space-y-4">
                <input type="hidden" id="clienteId" name="id" />
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Tipo Identificación</label>
                    <select th:field="*{tipoIdentificacion}" id="tipoIdentificacion" onchange="updateValidations()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm font-bold">
                        <option value="CEDULA">Cédula de Identidad</option>
                        <option value="RUC">RUC (13 Dígitos)</option>
                        <option value="PASAPORTE">Pasaporte</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Identificación</label>
                    <input type="text" th:field="*{identificacion}" id="identificacion" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm" placeholder="180xxxxxxx"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Razón Social / Nombre Completo</label>
                    <input type="text" th:field="*{razonSocial}" id="razonSocial" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm" placeholder="Ej. Juan Pérez"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Dirección Domiciliaria</label>
                    <input type="text" th:field="*{direccion}" id="direccion" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm"/>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-[1fr_2fr] gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Teléfono</label>
                        <input type="text" th:field="*{telefono}" id="telefono"
                               pattern="\+?[0-9]{9,15}"
                               title="Ingrese un teléfono válido. Puede incluir el código de país (ej. +593) seguido de 9 a 15 dígitos."
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm"
                               placeholder="+593 o 09..."/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Email</label>
                        <input type="email" th:field="*{email}" id="email" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mt-1 outline-none text-sm" placeholder="correo@comercial.com"/>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 text-white rounded-xl py-3 font-black text-sm hover:bg-blue-700 shadow-md">Guardar Cliente</button>
                    <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden px-4 bg-slate-200 text-slate-700 rounded-xl py-3 font-black text-sm hover:bg-slate-300">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                    <th class="px-6 py-4">Tipo</th>
                    <th class="px-6 py-4">Identificación</th>
                    <th class="px-6 py-4">Razón Social</th>
                    <th class="px-6 py-4 text-center">Estado</th>
                    <th class="px-6 py-4 text-center">Acciones</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                <tr th:each="c : ${clientes}" class="hover:bg-slate-50">
                    <td class="px-6 py-4"><span class="px-2 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold" th:text="${c.tipoIdentificacion}"></span></td>
                    <td class="px-6 py-4 font-bold text-slate-950" th:text="${c.identificacion}"></td>
                    <td class="px-6 py-4" th:text="${c.razonSocial}"></td>
                    <td class="px-6 py-4 text-center">
                        <span th:if="${c.activo}" class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-xs font-bold">Activo</span>
                        <span th:unless="${c.activo}" class="px-2 py-1 bg-red-100 text-red-700 rounded-lg text-xs font-bold">Inactivo</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button type="button"
                                    th:data-id="${c.id}"
                                    th:data-tipo="${c.tipoIdentificacion}"
                                    th:data-ident="${c.identificacion}"
                                    th:data-razon="${c.razonSocial}"
                                    th:data-dir="${c.direccion}"
                                    th:data-tel="${c.telefono}"
                                    th:data-email="${c.email}"
                                    onclick="cargarDatosEdicion(this)"
                                    class="text-blue-600 hover:text-blue-800 font-bold">Editar</button>
                            <form sec:authorize="hasAnyAuthority('ADMIN', 'ROLE_ADMIN')" th:action="@{'/clientes/toggle/' + ${c.id}}" method="POST" style="display:inline;">
                                <button type="submit" class="text-slate-500 hover:text-slate-700 text-xs font-bold" th:text="${c.activo ? 'Desactivar' : 'Activar'}"></button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function updateValidations() {
        const tipo = document.getElementById('tipoIdentificacion').value;
        const input = document.getElementById('identificacion');

        // CORRECCIÓN: Uso de [0-9] para evitar el problema de escape de \d en cadenas JS
        if (tipo === 'CEDULA') {
            input.setAttribute('minlength', '10');
            input.setAttribute('maxlength', '10');
            input.setAttribute('pattern', '[0-9]{10}');
            input.title = "Debe contener exactamente 10 dígitos numéricos";
            input.placeholder = 'Ej. 1722334455';
        } else if (tipo === 'RUC') {
            input.setAttribute('minlength', '13');
            input.setAttribute('maxlength', '13');
            input.setAttribute('pattern', '[0-9]{13}');
            input.title = "Debe contener exactamente 13 dígitos numéricos";
            input.placeholder = 'Ej. 1790011223001';
        } else if (tipo === 'PASAPORTE') {
            input.setAttribute('minlength', '3');
            input.setAttribute('maxlength', '13');
            input.setAttribute('pattern', '[A-Za-z0-9]{3,13}'); // Alfanumérico, sin caracteres especiales
            input.title = "Debe contener entre 3 y 13 caracteres alfanuméricos";
            input.placeholder = 'Ej. A1234567';
        }
    }

    function editCliente(id, tipo, ident, razon, dir, tel, email) {
        document.getElementById('clienteId').value = id;
        document.getElementById('tipoIdentificacion').value = tipo;
        document.getElementById('identificacion').value = ident;
        document.getElementById('identificacion').readOnly = true;
        document.getElementById('identificacion').classList.add('bg-slate-200', 'cursor-not-allowed');
        document.getElementById('razonSocial').value = razon;
        document.getElementById('direccion').value = dir === 'null' ? '' : dir;
        document.getElementById('telefono').value = tel === 'null' ? '' : tel;
        document.getElementById('email').value = email === 'null' ? '' : email;

        document.getElementById('formTitle').innerText = 'Editar Cliente';
        document.getElementById('submitBtn').innerText = 'Actualizar Cliente';
        document.getElementById('cancelBtn').classList.remove('hidden');

        updateValidations();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('clienteId').value = '';
        document.getElementById('clienteForm').reset();
        document.getElementById('identificacion').readOnly = false;
        document.getElementById('identificacion').classList.remove('bg-slate-200', 'cursor-not-allowed');
        document.getElementById('formTitle').innerText = 'Registrar Cliente';
        document.getElementById('submitBtn').innerText = 'Guardar Cliente';
        document.getElementById('cancelBtn').classList.add('hidden');
        updateValidations();
    }

    function cargarDatosEdicion(btnElement) {
        const id = btnElement.getAttribute('data-id');
        const tipo = btnElement.getAttribute('data-tipo');
        const ident = btnElement.getAttribute('data-ident');
        const razon = btnElement.getAttribute('data-razon');
        const dir = btnElement.getAttribute('data-dir');
        const tel = btnElement.getAttribute('data-tel');
        const email = btnElement.getAttribute('data-email');

        editCliente(id, tipo, ident, razon, dir, tel, email);
    }

    document.addEventListener('DOMContentLoaded', updateValidations);
</script>
</body>
</html>html>
