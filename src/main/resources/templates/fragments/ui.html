<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="toast">
    <div id="toastContainer" class="fixed bottom-5 right-5 z-[70] flex flex-col gap-3"></div>
    <script>
        function mostrarToast(mensaje, tipo = 'success') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            const bg = tipo === 'success' ? 'bg-emerald-500' : (tipo === 'warning' ? 'bg-amber-500' : 'bg-red-500');
            const icon = tipo === 'success' ? '✓' : (tipo === 'warning' ? '⚠️' : '✖');

            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-bold animate-slide-up min-w-[250px] max-w-sm transition-all duration-300 transform`;
            toast.innerHTML = `<span class="bg-white/20 rounded-full w-6 h-6 flex items-center justify-center shrink-0">${icon}</span> <span>${mensaje}</span>`;

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }
    </script>
</div>

<div th:fragment="confirmacion">
    <div id="modalConfirmacion" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[60]">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 text-center animate-pop-in">
            <div class="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">⚠️</div>
            <h3 class="font-black text-lg text-slate-900 mb-2">¿Está seguro?</h3>
            <p id="msgConfirmacion" class="text-sm text-slate-500 mb-6">Esta acción no se puede deshacer.</p>
            <div class="flex gap-3 justify-center">
                <button onclick="cerrarConfirmacion()" class="px-5 py-2 rounded-xl text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200">Cancelar</button>
                <button id="btnEjecutarConfirmacion" class="px-5 py-2 rounded-xl text-sm font-bold text-white bg-amber-500 hover:bg-amber-600 shadow-md">Sí, proceder</button>
            </div>
        </div>
    </div>
    <script>
        let confirmAction = null;
        function preguntarConfirmacion(mensaje, callback) {
            document.getElementById('msgConfirmacion').textContent = mensaje;
            confirmAction = callback;
            document.getElementById('modalConfirmacion').classList.remove('hidden');
            document.getElementById('modalConfirmacion').classList.add('flex');
        }
        function cerrarConfirmacion() {
            document.getElementById('modalConfirmacion').classList.add('hidden');
            document.getElementById('modalConfirmacion').classList.remove('flex');
            confirmAction = null;
        }
        document.getElementById('btnEjecutarConfirmacion')?.addEventListener('click', () => {
            if(confirmAction) confirmAction();
            cerrarConfirmacion();
        });
    </script>
</div>

<div th:fragment="sidebar">
    <aside class="w-64 bg-slate-900 text-white flex flex-col h-screen fixed left-0 top-0 z-50">
        <div class="h-16 flex items-center px-6 border-b border-slate-700">
            <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-600 text-white font-black text-sm mr-3">POS</span>
            <span class="font-bold text-lg tracking-wide">Sistema Fact</span>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto custom-scrollbar">
            <a th:href="@{/dashboard}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors">
                <span>🏠</span> Dashboard
            </a>

            <div class="text-xs font-black text-slate-500 uppercase tracking-wider mt-6 mb-2 px-4">Operaciones</div>

            <a sec:authorize="hasAnyAuthority('ADMIN', 'CAJERO')" th:href="@{/ventas/nuevo}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors text-blue-300 hover:text-blue-200">
                <span>🛒</span> Punto de Venta
            </a>
            <a sec:authorize="hasAnyAuthority('ADMIN', 'BODEGA', 'CAJERO')" th:href="@{/inventario}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors">
                <span>📦</span> Inventario
            </a>
            <a sec:authorize="hasAnyAuthority('ADMIN', 'CAJERO')" th:href="@{/facturas}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors">
                <span>📜</span> Facturas
            </a>

            <div class="text-xs font-black text-slate-500 uppercase tracking-wider mt-6 mb-2 px-4">Catálogos</div>

            <a sec:authorize="hasAnyAuthority('ADMIN', 'CAJERO')" th:href="@{/clientes}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors">
                <span>👥</span> Clientes
            </a>
            <a sec:authorize="hasAnyAuthority('ADMIN', 'BODEGA')" th:href="@{/productos}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors">
                <span>🏷️</span> Productos
            </a>
            <a sec:authorize="hasAnyAuthority('ADMIN', 'BODEGA')" th:href="@{/categorias}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors">
                <span>📁</span> Categorías
            </a>
            <a sec:authorize="hasAnyAuthority('ADMIN')" th:href="@{/sucursales}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors">
                <span>🏢</span> Sucursales
            </a>
            <a sec:authorize="hasAnyAuthority('ADMIN')" th:href="@{/configuracion-sri}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors">
                <span>⚙️</span> Config SRI
            </a>
            <a sec:authorize="hasAnyAuthority('ADMIN')" th:href="@{/usuarios}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-semibold transition-colors">
                <span>👤</span> Usuarios
            </a>
        </nav>

        <div class="p-4 border-t border-slate-700 bg-slate-900/50">
            <div class="px-2 mb-3">
                <p class="text-xs font-semibold text-blue-400 uppercase tracking-wider" sec:authentication="principal.authorities">[ROL]</p>
            </div>
            <form th:action="@{/logout}" method="POST">
                <button type="submit" class="w-full flex items-center justify-center gap-2 rounded-xl bg-slate-800 hover:bg-red-500 hover:text-white px-4 py-2.5 text-sm font-bold transition-all">
                    Salir
                </button>
            </form>
        </div>
    </aside>
</div>

</body>
</html>
