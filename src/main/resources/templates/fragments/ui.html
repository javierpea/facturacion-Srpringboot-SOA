<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="toast">
    <div id="toastContainer" class="fixed bottom-5 right-5 z-[70] flex flex-col gap-3"></div>
    <script>
        function mostrarToast(mensaje, tipo = 'success') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            const bg = tipo === 'success' ? 'bg-emerald-500' : (tipo === 'warning' ? 'bg-amber-500' : 'bg-red-500');
            const icon = tipo === 'success' ? '✓' : (tipo === 'warning' ? '⚠️' : '✖');

            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-bold animate-slide-up min-w-[250px] max-w-sm transition-all duration-300 transform`;
            toast.innerHTML = `<span class="bg-white/20 rounded-full w-6 h-6 flex items-center justify-center shrink-0">${icon}</span> <span>${mensaje}</span>`;

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }
    </script>
</div>

<div th:fragment="confirmacion">
    <div id="modalConfirmacion" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[60]">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 text-center animate-pop-in">
            <div class="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">⚠️</div>
            <h3 class="font-black text-lg text-slate-900 mb-2">¿Está seguro?</h3>
            <p id="msgConfirmacion" class="text-sm text-slate-500 mb-6">Esta acción no se puede deshacer.</p>
            <div class="flex gap-3 justify-center">
                <button onclick="cerrarConfirmacion()" class="px-5 py-2 rounded-xl text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200">Cancelar</button>
                <button id="btnEjecutarConfirmacion" class="px-5 py-2 rounded-xl text-sm font-bold text-white bg-amber-500 hover:bg-amber-600 shadow-md">Sí, proceder</button>
            </div>
        </div>
    </div>

    <!-- Modal de Alerta Custom -->
    <div id="modalAlerta" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[70]">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 text-center animate-pop-in border border-slate-200">
            <div id="iconAlerta" class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">✓</div>
            <h3 id="tituloAlerta" class="font-black text-xl text-slate-950 mb-2">Venta Exitosa</h3>
            <div id="msgAlerta" class="text-sm text-slate-600 mb-6 text-left space-y-2 max-h-[300px] overflow-y-auto bg-slate-50 p-4 rounded-2xl border border-slate-100 font-medium"></div>
            <div class="flex justify-center">
                <button id="btnCerrarAlerta" class="w-full sm:w-auto px-8 py-3 rounded-xl text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md transition-colors">Aceptar</button>
            </div>
        </div>
    </div>

    <script>
        let confirmAction = null;
        function preguntarConfirmacion(mensaje, callback) {
            document.getElementById('msgConfirmacion').textContent = mensaje;
            confirmAction = callback;
            document.getElementById('modalConfirmacion').classList.remove('hidden');
            document.getElementById('modalConfirmacion').classList.add('flex');
        }
        function cerrarConfirmacion() {
            document.getElementById('modalConfirmacion').classList.add('hidden');
            document.getElementById('modalConfirmacion').classList.remove('flex');
            confirmAction = null;
        }
        document.getElementById('btnEjecutarConfirmacion')?.addEventListener('click', () => {
            if(confirmAction) confirmAction();
            cerrarConfirmacion();
        });

        // Lógica de Alerta Custom
        let alertCallback = null;
        function mostrarAlerta(titulo, htmlContenido, tipo = 'success', callback = null) {
            document.getElementById('tituloAlerta').textContent = titulo;
            document.getElementById('msgAlerta').innerHTML = htmlContenido;
            alertCallback = callback;
            
            const iconDiv = document.getElementById('iconAlerta');
            if (tipo === 'success') {
                iconDiv.className = "w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold";
                iconDiv.textContent = "✓";
            } else if (tipo === 'error') {
                iconDiv.className = "w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold";
                iconDiv.textContent = "✕";
            } else {
                iconDiv.className = "w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl";
                iconDiv.textContent = "⚠️";
            }

            document.getElementById('modalAlerta').classList.remove('hidden');
            document.getElementById('modalAlerta').classList.add('flex');
        }

        function cerrarAlerta() {
            document.getElementById('modalAlerta').classList.add('hidden');
            document.getElementById('modalAlerta').classList.remove('flex');
            if (alertCallback) {
                alertCallback();
            }
        }
        document.getElementById('btnCerrarAlerta')?.addEventListener('click', cerrarAlerta);
    </script>
</div>

    <!-- Footer usuario -->
    <div class="p-3 border-t border-white/10">
        <div class="flex items-center gap-3 px-2 py-2 mb-2">

            <p class="text-xs font-bold text-blue-300 uppercase tracking-wider truncate" sec:authentication="principal.authorities">[ROL]</p>
        </div>
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="w-full flex items-center justify-center gap-2 rounded-xl bg-white/5 hover:bg-red-500/80 hover:text-white px-4 py-2.5 text-sm font-bold transition-all text-slate-300 border border-white/10 hover:border-red-500">

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            const links = document.querySelectorAll('aside nav a');
            links.forEach(link => {
                const hrefAttr = link.getAttribute('href');
                if (hrefAttr) {
                    let linkPath = hrefAttr;
                    if (linkPath.startsWith('http')) {
                        try {
                            linkPath = new URL(linkPath).pathname;
                        } catch (e) {}
                    }
                    
                    // Match current pathname with link target
                    const isMatch = currentPath === linkPath || 
                                    (linkPath !== '/' && linkPath !== '/dashboard' && currentPath.startsWith(linkPath)) ||
                                    (linkPath === '/dashboard' && currentPath === '/dashboard');
                    
                    if (isMatch) {
                        // Highlight active menu item
                        link.classList.remove('text-slate-300', 'text-blue-300', 'hover:text-white', 'hover:bg-white/10');
                        link.classList.add('bg-white/10', 'text-white', 'font-bold');
                        
                        const span = link.querySelector('span');
                        if (span) {
                            // Reset class name to highlight with blue
                            span.className = 'flex h-7 w-7 items-center justify-center rounded-lg bg-blue-600 text-white shadow-md shadow-blue-500/30';
                        }
                    }
                }
            });
        });
    </script>

</body>
</html>
